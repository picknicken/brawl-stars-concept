<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arena Brawlers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:dark; --bg:#14102e; --ink:#0b0820; --panel:#2a2468; --panel2:#3a3290; --accent:#ffd23a; --accent2:#ff9a1f; --blue:#3da5ff; --red:#ff5a5a;
          --font:'Lilita One','Arial Black','Trebuchet MS',system-ui,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:var(--font); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #hud { pointer-events:none; }
  .overlay { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .overlay.hidden { display:none; }
  .overlay > * { pointer-events:auto; }
  .ink { text-shadow:0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }

  /* ---- menu ---- */
  #menu { background:linear-gradient(180deg, rgba(12,8,40,.78) 0%, rgba(12,8,40,0) 26%, rgba(12,8,40,0) 52%, rgba(12,8,40,.92) 100%); }
  #menu .logo { position:absolute; top:max(14px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); margin:0; font-weight:400; font-size:clamp(26px,min(7vw,12vh),64px); letter-spacing:1px; color:var(--accent);
    text-shadow:0 5px 0 #a25a00, 0 8px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink); white-space:nowrap; }
  #menu .sub { position:absolute; top:calc(max(14px, env(safe-area-inset-top)) + clamp(34px,min(8.5vw,14.5vh),78px)); left:50%; transform:translateX(-50%); font-size:clamp(12px,2.2vw,18px); color:#cfc8ff; white-space:nowrap; }
  #info { position:absolute; right:max(16px, env(safe-area-inset-right)); top:calc(max(14px, env(safe-area-inset-top)) + clamp(60px,min(13vw,24vh),130px)); width:min(220px,30vw); background:linear-gradient(180deg,var(--panel2),var(--panel)); border:4px solid var(--ink); border-radius:16px; padding:12px 14px; box-shadow:0 6px 0 rgba(0,0,0,.35); }
  #info h2 { margin:0; font-weight:400; font-size:clamp(22px,4vw,32px); color:#fff; }
  #info .role { color:var(--accent); font-size:clamp(12px,1.8vw,15px); margin-bottom:8px; }
  #info .stat { display:grid; grid-template-columns:62px 1fr; align-items:center; gap:8px; font-size:12px; margin:5px 0; color:#d8d3ff; }
  #info .bar { height:10px; background:#150f3a; border-radius:6px; overflow:hidden; border:2px solid var(--ink); }
  #info .bar i { display:block; height:100%; background:linear-gradient(90deg,#46e06a,#b6f23a); }
  #info p { margin:8px 0 0; font-size:12px; line-height:1.35; color:#cfc8ff; font-family:system-ui,sans-serif; }
  #bottom { position:absolute; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); display:flex; align-items:flex-end; justify-content:flex-end; gap:clamp(10px,3vw,28px); padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .cards { display:flex; gap:clamp(8px,1.6vw,14px); }
  .card { width:min(11.5vw,21vh,104px); background:linear-gradient(180deg,var(--panel2),var(--panel)); border:4px solid var(--ink); border-radius:14px; padding:6px 6px 8px; cursor:pointer; text-align:center; transition:transform .12s; box-shadow:0 5px 0 rgba(0,0,0,.35); }
  .card canvas { position:static; width:100%; height:auto; border-radius:9px; border:3px solid var(--ink); display:block; }
  .card b { display:block; margin-top:5px; font-weight:400; font-size:clamp(13px,2.2vw,17px); }
  .card.sel { transform:translateY(-8px) scale(1.06); border-color:var(--accent); box-shadow:0 0 0 3px #ffd23a55, 0 8px 0 rgba(0,0,0,.35); }
  .btn { font-family:var(--font); font-size:clamp(20px,3.6vw,30px); padding:.45em 1.5em; border:4px solid var(--ink); border-radius:14px; background:linear-gradient(180deg,#ffe35a,#ffb41f); color:#3a2000; cursor:pointer;
    box-shadow:0 6px 0 #a25a00, 0 9px 0 var(--ink); text-shadow:0 2px 0 #fff6; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #a25a00, 0 5px 0 var(--ink); }
  .btn.alt { background:linear-gradient(180deg,#8fb7ff,#4a7df0); color:#fff; box-shadow:0 6px 0 #1f3f9a, 0 9px 0 var(--ink); text-shadow:0 2px 0 var(--ink); }
  @media (max-height:520px) { #help, #info p, #info .role { display:none; } #info .stat { margin:3px 0; } #info { padding:8px 12px; } #opts h3 { display:none; } }
  #help { font-family:system-ui,sans-serif; font-size:11px; line-height:1.5; color:#cfc8ff; background:rgba(10,8,30,.55); border-radius:10px; padding:8px 10px; }

  #opts { position:absolute; left:max(16px, env(safe-area-inset-left)); top:calc(max(14px, env(safe-area-inset-top)) + clamp(60px,min(13vw,24vh),130px)); display:flex; flex-direction:column; gap:6px; width:min(176px,25vw); }
  #opts h3 { margin:4px 0 0; font-weight:400; font-size:12px; color:#cfc8ff; letter-spacing:1px; }
  .pills { display:flex; flex-direction:column; gap:5px; } .pills.row { flex-direction:row; }
  .pill { flex:1; border:3px solid var(--ink); border-radius:11px; padding:4px 6px; font-size:clamp(12px,2vw,16px); text-align:center; cursor:pointer; background:linear-gradient(180deg,var(--panel2),var(--panel)); color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.35); white-space:nowrap; }
  .pills.row .pill { padding:4px 2px; font-size:clamp(11px,1.8vw,14px); }
  .pill.sel { background:linear-gradient(180deg,#ffe35a,#ffb41f); color:#3a2000; text-shadow:0 1px 0 #fff6; }
  #muteBtn { position:fixed; z-index:5; right:max(12px, env(safe-area-inset-right)); top:max(10px, env(safe-area-inset-top)); width:38px; height:38px; padding:0; border:3px solid var(--ink); border-radius:50%; background:linear-gradient(180deg,var(--panel2),var(--panel)); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 rgba(0,0,0,.35); }
  #muteBtn svg { width:20px; height:20px; }
  /* ---- end screen ---- */
  #end { background:rgba(10,8,30,.72); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
  #end.hidden { display:none; }
  #endTitle { margin:0; font-weight:400; font-size:clamp(46px,12vw,110px); letter-spacing:2px; text-shadow:0 7px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink); }
  #endStats { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #endStats div { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:4px solid var(--ink); border-radius:12px; padding:6px 16px; min-width:92px; }
  #endStats small { display:block; font-size:12px; color:#cfc8ff; } #endStats b { font-weight:400; font-size:26px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  #fatal { position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; background:var(--bg); text-align:center; padding:24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hud"></canvas>
<button id="muteBtn" aria-label="Geluid aan of uit"></button>

<div id="menu" class="overlay">
  <h1 class="logo">ARENA BRAWLERS</h1>
  <div class="sub">Gem Grab 3v3 &middot; houd 10 gems vast tot de timer afloopt</div>
  <div id="info"></div>
  <div id="opts">
    <h3>MODUS</h3><div class="pills" id="modePills"></div>
    <h3>BOTS</h3><div class="pills row" id="diffPills"></div>
    <div id="help"><b>PC</b> WASD lopen &middot; muis richten &middot; klik schieten &middot; E auto-aim &middot; spatie Super &middot; M geluid<br><b>Mobiel</b> tik op de aanvalsknop = auto-aim &middot; sleep = zelf richten</div>
  </div>
  <div id="bottom"><div class="cards" id="cards"></div><button class="btn" id="play">SPELEN</button></div>
</div>
<div id="end" class="overlay hidden">
  <h1 id="endTitle"></h1>
  <div id="endStats"></div>
  <div class="row"><button class="btn" id="again">OPNIEUW</button><button class="btn alt" id="toMenu">MENU</button></div>
</div>
<div id="fatal"><h2 id="fatalT" class="ink"></h2><div id="fatalM"></div></div>

<script src="lib/three.min.js"></script>
<script>
'use strict';
function fatal(t,m){ const f=document.getElementById('fatal'); f.style.display='flex'; document.getElementById('fatalT').textContent=t; document.getElementById('fatalM').textContent=m; }
if (typeof THREE === 'undefined') { fatal('Kan 3D niet laden','Three.js is niet geladen. Open de pagina in Chrome of Safari.'); throw new Error('three.js missing'); }

// =====================================================================
//  CONFIG
// =====================================================================
const W = 1200, H = 720, R = 16;
const FONT = "'Lilita One','Arial Black','Trebuchet MS',system-ui,sans-serif";
const BRAWLERS = [
  { id:'blaze', name:'Cinder', role:'Vuurspuwer · Korte afstand', color:'#ff7a2f', hp:3600, speed:150, reload:1.5, style:'brawl',
    desc:'Shotgun met 3 kogels. Super: salvo van 9 kogels.', stats:{ hp:.55, speed:.8, range:.4, dmg:.8 },
    atk:{ pellets:3, spread:0.28, dmg:330, range:300, speed:620, r:6 }, sup:{ type:'burst', pellets:9, spread:0.7, dmg:380, range:340 } },
  { id:'bolt', name:'Falco', role:'Scherpschutter · Lange afstand', color:'#2fc7b5', hp:2700, speed:140, reload:1.9, style:'ranged',
    desc:'Eén harde kogel over grote afstand. Super: doorboort alles.', stats:{ hp:.4, speed:.7, range:1, dmg:1 },
    atk:{ pellets:1, spread:0, dmg:1000, range:560, speed:900, r:6 }, sup:{ type:'pierce', dmg:1700, range:760, r:14 } },
  { id:'boulder', name:'Granite', role:'Tank · Dichtbij', color:'#a07a52', hp:6200, speed:125, reload:1.4, style:'rush',
    desc:'Slaat een schokgolf. Super: grote klap rondom.', stats:{ hp:1, speed:.5, range:.2, dmg:.55 },
    atk:{ pellets:1, spread:0, dmg:620, range:150, speed:520, r:20 }, sup:{ type:'slam', dmg:1500, radius:150 } },
  { id:'frost', name:'Rime', role:'Magiër · Vertraagt', color:'#58b8ff', hp:3000, speed:145, reload:1.6, style:'ranged',
    desc:'IJskogel vertraagt vijanden. Super: bevriest iedereen om je heen.', stats:{ hp:.45, speed:.75, range:.75, dmg:.6 },
    atk:{ pellets:1, spread:0, dmg:520, range:430, speed:560, r:9, slow:1.8 }, sup:{ type:'freeze', radius:190, dmg:700, stun:1.4 } },
  { id:'melody', name:'Lyric', role:'Support · Heelt vrienden', color:'#ff7ac8', hp:3400, speed:148, reload:1.5, style:'support',
    desc:'Geluidsgolf raakt vijanden en heelt vrienden. Super: heelt je team in de buurt.', stats:{ hp:.5, speed:.8, range:.65, dmg:.45 },
    atk:{ pellets:1, spread:0, dmg:420, range:380, speed:600, r:11, pierce:true, heal:420 }, sup:{ type:'heal', radius:230, heal:2200, dmg:500 } },
  { id:'shade', name:'Vanta', role:'Sluipmoordenaar · Snel', color:'#8a5cff', hp:2400, speed:175, reload:1.1, style:'rush',
    desc:'Twee dolken van dichtbij. Super: spring naar voren en sla toe.', stats:{ hp:.3, speed:1, range:.25, dmg:.85 },
    atk:{ pellets:2, spread:.14, dmg:400, range:215, speed:820, r:5 }, sup:{ type:'dash', range:270, dmg:1400, radius:85 } },
];
const WALLS = [[300,150,40,160],[300,410,40,160],[860,150,40,160],[860,410,40,160],[480,100,240,30],[480,590,240,30]];
const BUSHES = [[520,220,160,50],[520,450,160,50],[140,60,120,90],[940,570,120,90],[140,570,120,90],[940,60,120,90]];
const SPAWNS = { 0:[[70,260],[70,360],[70,460]], 1:[[1130,260],[1130,360],[1130,460]] };
const WIN_GEMS = 10, HOLD_TIME = 12, MATCH_TIME = 150, RESPAWN = 3, INTRO = 3.4;
const GOAL = { y0:270, y1:450, depth:52 }, BALL_R = 10, BALL_WIN = 2, BALL_TIME = 120;

// =====================================================================
//  STATE
// =====================================================================
const cv = document.getElementById('c'), hud = document.getElementById('hud'), hctx = hud.getContext('2d');
let sel = 0, state = 'menu', units = [], bullets = [], gems = [], fx = [], texts = [];
let timeLeft = 0, holdT = 0, holdTeam = -1, gemTimer = 0, shake = 0, introT = 0, stats = null;
const keys = {}, mouse = { cx:innerWidth/2, cy:innerHeight/2, x:W/2, y:H/2, down:false, moved:false };
const touch = { on: matchMedia('(pointer:coarse)').matches, move:null, atk:null, sup:null, pendAtk:null, pendSup:null };
let superQueued = false, aimDisp = null, lockTarget = null;
let mode = 'gem', diff = 'normal', score = [0,0], ball = null, goalT = 0, goalTeam = -1, overtime = false, matchOver = -2, introTitle = '';

const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff = (a,b)=>{ let d=(b-a)%(Math.PI*2); if (d>Math.PI) d-=Math.PI*2; if (d<-Math.PI) d+=Math.PI*2; return d; };
function circleRect(x,y,r,[rx,ry,rw,rh]) {
  const cx = Math.max(rx, Math.min(x, rx+rw)), cy = Math.max(ry, Math.min(y, ry+rh));
  const dx = x-cx, dy = y-cy; return dx*dx+dy*dy < r*r;
}
function hitsWall(x,y,r){ return WALLS.some(w=>circleRect(x,y,r,w)); }
function inBush(u){ return BUSHES.some(b=>u.x>b[0]&&u.x<b[0]+b[2]&&u.y>b[1]&&u.y<b[1]+b[3]); }
function visibleTo(target, team) {
  if (target.team === team || !inBush(target)) return true;
  return units.some(u=>u.team===team && !u.dead && dist(u,target) < 120);
}
function lineClear(a,b) {
  const n = Math.ceil(dist(a,b)/12);
  for (let i=1;i<n;i++){ const t=i/n; if (hitsWall(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t, 3)) return false; }
  return true;
}
function nearestEnemy(u, maxD) {
  let t=null, b=maxD||1e9;
  for (const e of units) { if (e.team===u.team || e.dead || !visibleTo(e,u.team)) continue; const d=dist(u,e); if (d<b){ b=d; t=e; } }
  return t;
}

// =====================================================================
//  3D RENDERING
// =====================================================================
// =====================================================================
//  SOUND (procedural WebAudio: no audio files needed)
// =====================================================================
const Snd = (()=>{
  let ac=null, master=null, sfxG=null, musG=null, noiseBuf=null, muted=false, timer=null, step=0, nextT=0;
  try { muted = localStorage.getItem('ab_mute')==='1'; } catch(e) {}
  const T = ()=>ac.currentTime;
  function init() {
    if (ac) { if (ac.state==='suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = muted?0:1; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = .9; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = .13; musG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    nextT = T()+.1; timer = setInterval(sched, 80);
  }
  function tone(f, dur, type, vol, f2, delay, dest) {
    if (!ac) return;
    const t = T()+(delay||0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol||.3), t+Math.min(.012,dur/3)); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(dest||sfxG); o.start(t); o.stop(t+dur+.03);
  }
  function noise(dur, vol, freq, type, delay, dest) {
    if (!ac) return;
    const t = T()+(delay||0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type||'lowpass'; f.frequency.setValueAtTime(freq||1200,t); f.frequency.exponentialRampToValueAtTime(Math.max(80,(freq||1200)*.35), t+dur);
    g.gain.setValueAtTime(vol||.3,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||sfxG); s.start(t, Math.random()*.5); s.stop(t+dur+.03);
  }
  // little looping beat: bass + lead + kick + hat
  const BASS = [55,0,55,0,65.4,0,55,0,73.4,0,73.4,0,65.4,0,49,0];
  const LEAD = [0,440,0,523,0,659,523,0, 0,587,0,523,0,440,392,0];
  function sched() {
    if (!ac || ac.state!=='running') return;
    while (nextT < T()+.3) {
      const dl = nextT-T(), i = step%16;
      if (BASS[i]) tone(BASS[i], .24, 'triangle', .55, null, dl, musG);
      if (LEAD[i]) tone(LEAD[i], .16, 'square', .1, null, dl, musG);
      if (i%4===0) tone(120, .14, 'sine', .8, 42, dl, musG);
      if (i%2===1) noise(.04, .12, 9000, 'highpass', dl, musG);
      nextT += .24; step++;
    }
    if (nextT < T()) nextT = T()+.1;
  }
  const S = {
    shoot_blaze:v=>{ noise(.16,.55*v,1900,'lowpass'); tone(160,.13,'sawtooth',.28*v,55); },
    shoot_bolt:v=>{ tone(1100,.2,'sawtooth',.2*v,180); noise(.06,.3*v,6000,'highpass'); },
    shoot_boulder:v=>{ noise(.22,.5*v,500,'lowpass'); tone(95,.22,'sine',.6*v,38); },
    shoot_frost:v=>{ tone(700,.22,'triangle',.3*v,1500); tone(1400,.18,'sine',.12*v,2200,.04); },
    shoot_melody:v=>{ tone(523,.22,'sine',.3*v,null); tone(784,.22,'sine',.22*v,null,.02); tone(1046,.2,'triangle',.1*v,null,.04); },
    shoot_shade:v=>{ noise(.07,.35*v,7000,'highpass'); tone(1500,.08,'square',.1*v,800); },
    hit:v=>{ noise(.07,.28*v,1400,'bandpass'); tone(230,.09,'square',.12*v,110); },
    kill:v=>{ noise(.4,.5*v,1800,'lowpass'); tone(320,.4,'sawtooth',.25*v,50); },
    gem:v=>{ tone(1250,.1,'sine',.26*v,1700); tone(1900,.13,'sine',.2*v,null,.07); },
    heal:v=>{ tone(660,.16,'sine',.22*v,990); },
    ready:v=>{ [660,880,1100,1320].forEach((f,i)=>tone(f,.14,'triangle',.22,null,i*.06)); },
    super:v=>{ noise(.45,.5*v,3500,'bandpass'); tone(180,.45,'sawtooth',.3*v,900); },
    kick:v=>{ noise(.1,.5*v,900,'lowpass'); tone(170,.12,'sine',.7*v,60); },
    goal:v=>{ tone(220,1.1,'sawtooth',.28,null); tone(223,1.1,'sawtooth',.28,null); tone(440,1.1,'square',.1,null); [523,659,784,1046].forEach((f,i)=>tone(f,.22,'square',.14,null,.25+i*.12)); },
    respawn:v=>{ tone(400,.2,'sine',.25*v,900); },
    beep:v=>{ tone(880,.14,'sine',.35,null); },
    go:v=>{ tone(1320,.36,'triangle',.4,null); tone(1980,.3,'sine',.18,null,.02); },
    click:v=>{ tone(900,.05,'square',.12,500); },
    win:v=>{ [523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.2,null,i*.13)); },
    lose:v=>{ [392,370,349,330].forEach((f,i)=>tone(f,.3,'sawtooth',.18,null,i*.2)); },
  };
  function play(name, x, y, vol) {
    if (!ac || muted) return;
    let v = vol===undefined ? 1 : vol;
    if (x!==undefined && units[0]) { const d = Math.hypot(x-units[0].x, y-units[0].y); v *= clamp(1.15-d/760, 0, 1); if (v < .06) return; }
    const f = S[name]; if (f) f(v);
  }
  function setMuted(m) { muted = m; try { localStorage.setItem('ab_mute', m?'1':'0'); } catch(e) {} if (master) master.gain.value = m?0:1; }
  document.addEventListener('visibilitychange', ()=>{ if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });
  return { init, play, setMuted, get muted(){ return muted; } };
})();

THREE.ColorManagement.legacyMode = false;
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, powerPreference:'high-performance' }); }
catch (e) { fatal('WebGL niet beschikbaar','Deze browser ondersteunt geen 3D (WebGL). Probeer Chrome of Safari.'); throw e; }
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#86d4ff');
scene.fog = new THREE.Fog('#a8e0ff', 1500, 3600);
const camera = new THREE.PerspectiveCamera(30, 1, 10, 5000);

function burst(x,y,z,color,n,spd,life,size,grav) {

    p.vx = Math.cos(a)*spd*rnd(.4,1)*(1-Math.abs(e)*.3); p.vz = Math.sin(a)*spd*rnd(.4,1)*(1-Math.abs(e)*.3); p.vy = e*spd*rnd(.4,1)+20;
    p.life = p.max = life*rnd(.7,1.2); p.s = size*rnd(.6,1.2); p.g = grav===undefined?260:grav; p.m.scale.setScalar(p.s); }
}
function updateParticles(dt) {
  for (const p of parts) { if (p.life<=0) continue; p.life -= dt; if (p.life<=0) { p.m.visible = false; continue; }
    p.vy -= p.g*dt; p.m.position.x += p.vx*dt; p.m.position.y = Math.max(1,p.m.position.y+p.vy*dt); p.m.position.z += p.vz*dt;
    const k = p.life/p.max; p.m.material.opacity = Math.min(1,k*1.6); p.m.scale.setScalar(p.s*(.4+.6*k)); }
}

function syncSet(map, list, create, upd) {
  const live = new Set(list);
  for (const [k,m] of map) if (!live.has(k)) { scene.remove(m); map.delete(k); }
  for (const o of list) { let m = map.get(o); if (!m) { m = create(o); map.set(o,m); scene.add(m); } upd(o,m); }

function animateChar(u, m, dt, t) {

}

// ---------- main update ----------
let introN = 99;
function update(dt) {

    const sx = b.vx*dt, sy = b.vy*dt; b.x+=sx; b.y+=sy; b.d+=Math.hypot(sx,sy);

    else if (hitsWall(b.x,b.y,b.r*.5)) { b.dead = true; burst(b.x,22,b.y,'#d9c3a0',5,100,.25,2); fx.push({kind:'ring',x:b.x,y:b.y,r:2,max:14,t:0,life:.2,color:'#ffffff'}); }

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05,(now-last)/1000); last=now;

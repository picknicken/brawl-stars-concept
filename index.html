<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arena Brawlers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:dark; --bg:#14102e; --ink:#0b0820; --panel:#2a2468; --panel2:#3a3290; --accent:#ffd23a; --accent2:#ff9a1f; --blue:#3da5ff; --red:#ff5a5a;
          --font:'Lilita One','Arial Black','Trebuchet MS',system-ui,sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:var(--font); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #hud { pointer-events:none; }
  .overlay { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .overlay.hidden { display:none; }
  .overlay > * { pointer-events:auto; }
  .ink { text-shadow:0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }

  /* ---- menu ---- */
  #menu { background:linear-gradient(180deg, rgba(12,8,40,.78) 0%, rgba(12,8,40,0) 26%, rgba(12,8,40,0) 52%, rgba(12,8,40,.92) 100%); }
  #menu .logo { position:absolute; top:max(14px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%); margin:0; font-weight:400; font-size:clamp(26px,min(7vw,12vh),64px); letter-spacing:1px; color:var(--accent);
    text-shadow:0 5px 0 #a25a00, 0 8px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink); white-space:nowrap; }
  #menu .sub { position:absolute; top:calc(max(14px, env(safe-area-inset-top)) + clamp(34px,min(8.5vw,14.5vh),78px)); left:50%; transform:translateX(-50%); font-size:clamp(12px,2.2vw,18px); color:#cfc8ff; white-space:nowrap; }
  #info { position:absolute; left:max(16px, env(safe-area-inset-left)); top:calc(max(14px, env(safe-area-inset-top)) + clamp(60px,min(13vw,24vh),130px)); width:min(220px,30vw); background:linear-gradient(180deg,var(--panel2),var(--panel)); border:4px solid var(--ink); border-radius:16px; padding:12px 14px; box-shadow:0 6px 0 rgba(0,0,0,.35); }
  #info h2 { margin:0; font-weight:400; font-size:clamp(22px,4vw,32px); color:#fff; }
  #info .role { color:var(--accent); font-size:clamp(12px,1.8vw,15px); margin-bottom:8px; }
  #info .stat { display:grid; grid-template-columns:62px 1fr; align-items:center; gap:8px; font-size:12px; margin:5px 0; color:#d8d3ff; }
  #info .bar { height:10px; background:#150f3a; border-radius:6px; overflow:hidden; border:2px solid var(--ink); }
  #info .bar i { display:block; height:100%; background:linear-gradient(90deg,#46e06a,#b6f23a); }
  #info p { margin:8px 0 0; font-size:12px; line-height:1.35; color:#cfc8ff; font-family:system-ui,sans-serif; }
  #bottom { position:absolute; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom)); display:flex; align-items:flex-end; justify-content:flex-end; gap:clamp(10px,3vw,28px); padding:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  .cards { display:flex; gap:clamp(8px,1.6vw,14px); }
  .card { width:min(14vw,25vh,112px); background:linear-gradient(180deg,var(--panel2),var(--panel)); border:4px solid var(--ink); border-radius:14px; padding:6px 6px 8px; cursor:pointer; text-align:center; transition:transform .12s; box-shadow:0 5px 0 rgba(0,0,0,.35); }
  .card canvas { position:static; width:100%; height:auto; border-radius:9px; border:3px solid var(--ink); display:block; }
  .card b { display:block; margin-top:5px; font-weight:400; font-size:clamp(13px,2.2vw,17px); }
  .card.sel { transform:translateY(-8px) scale(1.06); border-color:var(--accent); box-shadow:0 0 0 3px #ffd23a55, 0 8px 0 rgba(0,0,0,.35); }
  .btn { font-family:var(--font); font-size:clamp(20px,3.6vw,30px); padding:.45em 1.5em; border:4px solid var(--ink); border-radius:14px; background:linear-gradient(180deg,#ffe35a,#ffb41f); color:#3a2000; cursor:pointer;
    box-shadow:0 6px 0 #a25a00, 0 9px 0 var(--ink); text-shadow:0 2px 0 #fff6; }
  .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #a25a00, 0 5px 0 var(--ink); }
  .btn.alt { background:linear-gradient(180deg,#8fb7ff,#4a7df0); color:#fff; box-shadow:0 6px 0 #1f3f9a, 0 9px 0 var(--ink); text-shadow:0 2px 0 var(--ink); }
  @media (max-height:520px) { #help, #info p { display:none; } #info .stat { margin:3px 0; } #info { padding:8px 12px; } }
  #help { position:absolute; right:max(14px, env(safe-area-inset-right)); top:max(14px, env(safe-area-inset-top)); width:min(240px,30vw); font-family:system-ui,sans-serif; font-size:11px; line-height:1.5; color:#cfc8ff; background:rgba(10,8,30,.55); border-radius:10px; padding:8px 10px; }

  /* ---- end screen ---- */
  #end { background:rgba(10,8,30,.72); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; }
  #end.hidden { display:none; }
  #endTitle { margin:0; font-weight:400; font-size:clamp(46px,12vw,110px); letter-spacing:2px; text-shadow:0 7px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink); }
  #endStats { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #endStats div { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:4px solid var(--ink); border-radius:12px; padding:6px 16px; min-width:92px; }
  #endStats small { display:block; font-size:12px; color:#cfc8ff; } #endStats b { font-weight:400; font-size:26px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  #fatal { position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center; flex-direction:column; gap:8px; background:var(--bg); text-align:center; padding:24px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="hud"></canvas>

<div id="menu" class="overlay">
  <h1 class="logo">ARENA BRAWLERS</h1>
  <div class="sub">Gem Grab 3v3 &middot; houd 10 gems vast tot de timer afloopt</div>
  <div id="info"></div>
  <div id="help"><b>PC</b> WASD = lopen &middot; muis = richten &middot; klik = schieten &middot; E = auto-aim &middot; spatie = Super<br><b>Mobiel</b> linker duim = lopen &middot; tik op de aanvalsknop = auto-aim &middot; sleep = zelf richten, loslaten = schieten</div>
  <div id="bottom"><div class="cards" id="cards"></div><button class="btn" id="play">SPELEN</button></div>
</div>
<div id="end" class="overlay hidden">
  <h1 id="endTitle"></h1>
  <div id="endStats"></div>
  <div class="row"><button class="btn" id="again">OPNIEUW</button><button class="btn alt" id="toMenu">MENU</button></div>
</div>
<div id="fatal"><h2 id="fatalT" class="ink"></h2><div id="fatalM"></div></div>

<script src="lib/three.min.js"></script>
<script>
'use strict';
function fatal(t,m){ const f=document.getElementById('fatal'); f.style.display='flex'; document.getElementById('fatalT').textContent=t; document.getElementById('fatalM').textContent=m; }
if (typeof THREE === 'undefined') { fatal('Kan 3D niet laden','Three.js is niet geladen. Open de pagina in Chrome of Safari.'); throw new Error('three.js missing'); }

// =====================================================================
//  CONFIG
// =====================================================================
const W = 1200, H = 720, R = 16;
const FONT = "'Lilita One','Arial Black','Trebuchet MS',system-ui,sans-serif";
const BRAWLERS = [
  { id:'blaze', name:'Blaze', role:'Vuurspuwer · Korte afstand', color:'#ff7a2f', hp:3600, speed:215, reload:1.5,
    desc:'Shotgun met 3 kogels. Super: salvo van 9 kogels.', stats:{ hp:.55, speed:.8, range:.4, dmg:.8 },
    atk:{ pellets:3, spread:0.28, dmg:330, range:300, speed:620, r:6 }, sup:{ type:'burst', pellets:9, spread:0.7, dmg:380, range:340 } },
  { id:'bolt', name:'Bolt', role:'Scherpschutter · Lange afstand', color:'#2fc7b5', hp:2700, speed:200, reload:1.9,
    desc:'Eén harde kogel over grote afstand. Super: doorboort alles.', stats:{ hp:.4, speed:.7, range:1, dmg:1 },
    atk:{ pellets:1, spread:0, dmg:1000, range:560, speed:900, r:6 }, sup:{ type:'pierce', dmg:1700, range:760, r:14 } },
  { id:'boulder', name:'Boulder', role:'Tank · Dichtbij', color:'#a07a52', hp:6200, speed:185, reload:1.4,
    desc:'Slaat een schokgolf. Super: grote klap rondom.', stats:{ hp:1, speed:.5, range:.2, dmg:.55 },
    atk:{ pellets:1, spread:0, dmg:620, range:150, speed:520, r:20 }, sup:{ type:'slam', dmg:1500, radius:150 } },
];
const WALLS = [[300,150,40,160],[300,410,40,160],[860,150,40,160],[860,410,40,160],[480,100,240,30],[480,590,240,30]];
const BUSHES = [[520,220,160,50],[520,450,160,50],[140,60,120,90],[940,570,120,90],[140,570,120,90],[940,60,120,90]];
const SPAWNS = { 0:[[70,260],[70,360],[70,460]], 1:[[1130,260],[1130,360],[1130,460]] };
const WIN_GEMS = 10, HOLD_TIME = 12, MATCH_TIME = 150, RESPAWN = 3, INTRO = 3.4;

// =====================================================================
//  STATE
// =====================================================================
const cv = document.getElementById('c'), hud = document.getElementById('hud'), hctx = hud.getContext('2d');
let sel = 0, state = 'menu', units = [], bullets = [], gems = [], fx = [], texts = [];
let timeLeft = 0, holdT = 0, holdTeam = -1, gemTimer = 0, shake = 0, introT = 0, stats = null;
const keys = {}, mouse = { cx:innerWidth/2, cy:innerHeight/2, x:W/2, y:H/2, down:false, moved:false };
const touch = { on: matchMedia('(pointer:coarse)').matches, move:null, atk:null, sup:null, pendAtk:null, pendSup:null };
let superQueued = false, aimDisp = null, lockTarget = null;

const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff = (a,b)=>{ let d=(b-a)%(Math.PI*2); if (d>Math.PI) d-=Math.PI*2; if (d<-Math.PI) d+=Math.PI*2; return d; };
function circleRect(x,y,r,[rx,ry,rw,rh]) {
  const cx = Math.max(rx, Math.min(x, rx+rw)), cy = Math.max(ry, Math.min(y, ry+rh));
  const dx = x-cx, dy = y-cy; return dx*dx+dy*dy < r*r;
}
function hitsWall(x,y,r){ return WALLS.some(w=>circleRect(x,y,r,w)); }
function inBush(u){ return BUSHES.some(b=>u.x>b[0]&&u.x<b[0]+b[2]&&u.y>b[1]&&u.y<b[1]+b[3]); }
function visibleTo(target, team) {
  if (target.team === team || !inBush(target)) return true;
  return units.some(u=>u.team===team && !u.dead && dist(u,target) < 120);
}
function lineClear(a,b) {
  const n = Math.ceil(dist(a,b)/12);
  for (let i=1;i<n;i++){ const t=i/n; if (hitsWall(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t, 3)) return false; }
  return true;
}
function nearestEnemy(u, maxD) {
  let t=null, b=maxD||1e9;
  for (const e of units) { if (e.team===u.team || e.dead || !visibleTo(e,u.team)) continue; const d=dist(u,e); if (d<b){ b=d; t=e; } }
  return t;
}

// =====================================================================
//  3D RENDERING
// =====================================================================
THREE.ColorManagement.legacyMode = false;
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas:cv, antialias:true, powerPreference:'high-performance' }); }
catch (e) { fatal('WebGL niet beschikbaar','Deze browser ondersteunt geen 3D (WebGL). Probeer Chrome of Safari.'); throw e; }
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#86d4ff');
scene.fog = new THREE.Fog('#a8e0ff', 1500, 3600);
const camera = new THREE.PerspectiveCamera(30, 1, 10, 5000);
const camTarget = new THREE.Vector3(W/2, 0, H/2);

scene.add(new THREE.HemisphereLight('#dff2ff', '#b59a74', 1.0));
const sun = new THREE.DirectionalLight('#fff1d6', 1.25);
sun.castShadow = true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera, { left:-620, right:620, top:420, bottom:-420, near:100, far:2400 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.6;
scene.add(sun, sun.target);
const rim = new THREE.DirectionalLight('#9fd0ff', .35); rim.position.set(W/2+300, 400, H/2-500); scene.add(rim);

const ramp = (()=>{ const d = new Uint8Array([120,120,120,255, 200,200,200,255, 255,255,255,255]);
  const t = new THREE.DataTexture(d,3,1,THREE.RGBAFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const OUTLINE = new THREE.MeshBasicMaterial({ color:0x120a1c, side:THREE.BackSide });
const toon = (c, extra)=> new THREE.MeshToonMaterial(Object.assign({ color:c, gradientMap:ramp }, extra||{}));
const srgb = t=>{ t.encoding = THREE.sRGBEncoding; return t; };

function addOutline(m, t) {
  const g = m.geometry; if (!g.boundingBox) g.computeBoundingBox();
  const s = new THREE.Vector3(); g.boundingBox.getSize(s);
  const ol = new THREE.Mesh(g, OUTLINE);
  const f = (d,sc)=>{ const dim = Math.max(.001, d*sc); return 1 + 2*t/dim; };
  ol.scale.set(f(s.x,m.scale.x), f(s.y,m.scale.y), f(s.z,m.scale.z));
  const c = new THREE.Vector3(); g.boundingBox.getCenter(c);   // keep the shell centred on the geometry's bbox
  ol.position.set(c.x*(1-ol.scale.x), c.y*(1-ol.scale.y), c.z*(1-ol.scale.z));
  m.add(ol);
}
function mk(geo, color, o) {
  o = o || {};
  const m = new THREE.Mesh(geo, o.mat || toon(color, o.extra));
  m.castShadow = o.cast !== false; m.receiveShadow = o.recv !== false;
  if (o.pos) m.position.set(...o.pos);
  if (o.sc) m.scale.set(...o.sc);
  if (o.rot) m.rotation.set(...o.rot);
  if (o.ol !== 0) addOutline(m, o.ol || .9);
  return m;
}

// ---------- textures ----------
function brickTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  g.fillStyle = '#5b3a24'; g.fillRect(0,0,256,256);
  for (let r=0;r<4;r++) for (let i=-1;i<3;i++) {
    const x = i*128 + (r%2?64:0), y = r*64;
    const v = rnd(-10,10); g.fillStyle = `rgb(${160+v},${108+v},${70+v})`;
    g.beginPath(); g.roundRect(x+4,y+4,120,56,8); g.fill();
    g.fillStyle='rgba(255,255,255,.14)'; g.fillRect(x+8,y+7,112,6);
    g.fillStyle='rgba(0,0,0,.14)'; g.fillRect(x+8,y+52,112,6);
  }
  return srgb(new THREE.CanvasTexture(c));
}
function groundTexture() {
  const S = 2, c = document.createElement('canvas'); c.width = W*S; c.height = H*S; const g = c.getContext('2d'); g.scale(S,S);
  for (let x=0;x<W;x+=60) for (let y=0;y<H;y+=60) { g.fillStyle=((x+y)/60)%2?'#e0c27c':'#e8cd8a'; g.fillRect(x,y,60,60); }
  for (let x=0;x<W;x+=60) for (let y=0;y<H;y+=60) { g.strokeStyle='rgba(150,110,50,.18)'; g.lineWidth=2; g.strokeRect(x+1,y+1,58,58); }
  const gr = g.createRadialGradient(W/2,H/2,20,W/2,H/2,150); gr.addColorStop(0,'rgba(170,100,255,.35)'); gr.addColorStop(1,'rgba(170,100,255,0)');
  g.fillStyle = gr; g.fillRect(W/2-160,H/2-160,320,320);
  g.fillStyle='rgba(61,165,255,.34)'; g.fillRect(0,200,150,320);
  g.fillStyle='rgba(255,90,90,.34)'; g.fillRect(W-150,200,150,320);
  g.strokeStyle='rgba(61,165,255,.8)'; g.lineWidth=5; g.setLineDash([16,12]); g.strokeRect(2,200,148,320);
  g.strokeStyle='rgba(255,90,90,.8)'; g.strokeRect(W-150,200,148,320); g.setLineDash([]);
  for (let i=0;i<340;i++){ g.fillStyle='rgba(120,90,40,.13)'; g.beginPath(); g.arc(rnd(0,W),rnd(0,H),rnd(2,7),0,7); g.fill(); }
  const t = srgb(new THREE.CanvasTexture(c)); t.anisotropy = 8; return t;
}

// ---------- arena ----------
(function buildArena() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(W,H), new THREE.MeshToonMaterial({ map:groundTexture(), gradientMap:ramp }));
  ground.rotation.x = -Math.PI/2; ground.position.set(W/2,0,H/2); ground.receiveShadow = true; scene.add(ground);
  const grass = new THREE.Mesh(new THREE.PlaneGeometry(7000,7000), toon('#58b04c'));
  grass.rotation.x = -Math.PI/2; grass.position.set(W/2,-2,H/2); grass.receiveShadow = true; scene.add(grass);
  // arena rim (stone curb)
  const stone = '#9b7a58';
  const curb = (x,y,w,h)=>{ const m = mk(new THREE.BoxGeometry(w,30,h), stone, { pos:[x,15,y] }); scene.add(m);
    const cap = mk(new THREE.BoxGeometry(w+4,6,h+4), '#c9a174', { pos:[x,33,y] }); scene.add(cap); };
  curb(W/2,-16,W+64,32); curb(W/2,H+16,W+64,32); curb(-16,H/2,32,H); curb(W+16,H/2,32,H);
  // brick walls
  const bt = brickTexture();
  for (const [x,y,w,h] of WALLS) {
    const t = bt.clone(); t.needsUpdate = true; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(Math.max(w,h)/64, 1);
    const m = mk(new THREE.BoxGeometry(w,64,h), 0, { mat:toon('#ffffff',{ map:t }), pos:[x+w/2,32,y+h/2], ol:1.1 }); scene.add(m);
    const cap = mk(new THREE.BoxGeometry(w+8,10,h+8), '#d6a273', { pos:[x+w/2,69,y+h/2], ol:1.1 }); scene.add(cap);
  }
  // bushes
  for (const [x,y,w,h] of BUSHES) {
    for (let i=0;i<w/16;i++) for (let j=0;j<h/16;j++) {
      const r = rnd(12,17);
      const b = mk(new THREE.IcosahedronGeometry(r,1), (i+j)%2?'#36b552':'#4bd062', { pos:[x+9+i*16+rnd(-3,3), rnd(13,22), y+9+j*16+rnd(-3,3)], ol:.7 });
      scene.add(b);
    }
  }
  // grass tufts + pebbles on the sand (cosmetic)
  for (let i=0;i<70;i++) {
    const x = rnd(40,W-40), y = rnd(30,H-30);
    if (hitsWall(x,y,18) || BUSHES.some(b=>x>b[0]-10&&x<b[0]+b[2]+10&&y>b[1]-10&&y<b[1]+b[3]+10)) continue;
    const g = new THREE.Group();
    for (let k=0;k<3;k++) { const c = new THREE.Mesh(new THREE.ConeGeometry(1.8,rnd(6,10),5), toon('#4bbd48')); c.position.set(rnd(-3,3),4,rnd(-3,3)); c.rotation.z = rnd(-.3,.3); g.add(c); }
    g.position.set(x,0,y); scene.add(g);
  }
  // gem mine
  const base = mk(new THREE.CylinderGeometry(36,44,12,12), '#6f6f86', { pos:[W/2,6,H/2] }); scene.add(base);
  const crystalMat = ()=>toon('#a05cff',{ emissive:new THREE.Color('#7a35e8'), emissiveIntensity:.9 });
  [[0,0,1.8],[18,9,1.15],[-15,11,1.05],[9,-17,1.25],[-12,-13,.95],[20,-8,.8]].forEach(([dx,dz,s])=>{
    const c = mk(new THREE.OctahedronGeometry(11,0), 0, { mat:crystalMat(), pos:[W/2+dx, 12+14*s, H/2+dz], sc:[.8*s,1.5*s,.8*s], rot:[0,rnd(0,3),0] }); scene.add(c); });
  const glow = new THREE.PointLight('#b47cff', 1.4, 260); glow.position.set(W/2,55,H/2); scene.add(glow);
  // scenery outside the arena
  let seed = 7; const rr = ()=>(seed = (seed*16807)%2147483647)/2147483647;
  for (let i=0;i<70;i++) {
    const x = -420 + rr()*(W+840), y = -360 + rr()*(H+720);
    if (x>-70 && x<W+70 && y>-70 && y<H+70) continue;
    if (rr()<.62) { // tree
      const g = new THREE.Group(), s = .8+rr()*.9;
      g.add(mk(new THREE.CylinderGeometry(6,8,40,8),'#8a5a35',{ pos:[0,20,0], cast:false }));
      [[0,52,34],[0,76,26],[0,96,17]].forEach(([_,yy,r],k)=> g.add(mk(new THREE.IcosahedronGeometry(r,1), k%2?'#3fa54a':'#4cba58', { pos:[0,yy,0], cast:false })));
      g.scale.setScalar(s); g.position.set(x,0,y); scene.add(g);
    } else { // rock
      const m = mk(new THREE.DodecahedronGeometry(14+rr()*18,0),'#8b8fa3',{ pos:[x,10,y], sc:[1,.7,1], rot:[rr(),rr()*3,rr()], cast:false }); scene.add(m);
    }
  }
})();

// =====================================================================
//  BRAWLER MODELS
// =====================================================================
const CH = {};  // per-brawler build recipes
function buildChar(u) {
  const b = u.b, id = b.id, root = new THREE.Group(), rig = new THREE.Group(); root.add(rig);

}
function startMatch() {

  units = [ newUnit(0,0,BRAWLERS[sel],true), newUnit(0,1,pick(),false), newUnit(0,2,pick(),false),
            newUnit(1,0,pick(),false), newUnit(1,1,pick(),false), newUnit(1,2,pick(),false) ];
  bullets = []; gems = []; fx = []; texts = []; aimDisp = null; lockTarget = null;

function teamGems(t){ return units.filter(u=>u.team===t).reduce((s,u)=>s+u.gems,0); }

// ---------- combat ----------
function fire(u, ang, isSuper) {
  const b = u.b; u.recoil = 1; u.ang = ang;
  const mx = u.x+Math.cos(ang)*26, mz = u.y+Math.sin(ang)*26;
  if (isSuper) {
    const s = b.sup;
    if (s.type === 'slam') {
      fx.push({ kind:'ring', x:u.x, y:u.y, r:10, max:s.radius, t:0, life:.4, color:b.color });
      fx.push({ kind:'ring', x:u.x, y:u.y, r:6, max:s.radius*.7, t:0, life:.3, color:'#ffffff' });
      for (const e of units) if (e.team!==u.team && !e.dead && dist(e,u) < s.radius+R) damage(e,u,s.dmg);
      burst(u.x,8,u.y,'#d9b98a',26,170,.6,3.4); shake = 9;
    } else if (s.type === 'burst') {
      for (let i=0;i<s.pellets;i++) bullets.push(mkBullet(u, ang + (i/(s.pellets-1)-.5)*s.spread, s.dmg, s.range, 640, 7, false));
      burst(mx,22,mz,'#ffb43a',12,150,.25,2.6); shake = 3;
    } else { bullets.push(mkBullet(u, ang, s.dmg, s.range, 1000, s.r, true)); burst(mx,22,mz,'#7ff3ff',10,140,.25,2.6); shake = 3; }
    u.sup = 0; return;
  }
  const a = b.atk;
  for (let i=0;i<a.pellets;i++) {
    const off = a.pellets===1 ? 0 : (i/(a.pellets-1)-.5)*a.spread;
    bullets.push(mkBullet(u, ang + off + rnd(-.03,.03), a.dmg, a.range, a.speed, a.r, false));
  }
  if (b.id==='boulder') burst(mx,14,mz,'#d9b98a',8,120,.3,2.4); else burst(mx,22,mz,b.id==='blaze'?'#ffb43a':'#7ff3ff',6,130,.2,2.2,0);
  u.ammo--;
}
function mkBullet(u, ang, dmg, range, speed, r, pierce) {
  return { x:u.x+Math.cos(ang)*(R+8), y:u.y+Math.sin(ang)*(R+8), vx:Math.cos(ang)*speed, vy:Math.sin(ang)*speed,

}
function damage(t, src, dmg) {
  if (t.dead) return;
  t.hp -= dmg; t.flash = .12;
  burst(t.x,24,t.y,'#ffe27a',6,130,.3,2.2);
  texts.push({ x:t.x+rnd(-8,8), y:t.y, s:String(Math.round(dmg)), t:0, color: t.team===0?'#ff9a9a':'#ffffff' });
  if (src) { src.sup = Math.min(100, src.sup + dmg/25); if (src.isPlayer && stats) stats.dmg += dmg; }
  if (t.hp <= 0) kill(t, src);
}
function kill(u, src) {
  u.dead = true; u.respT = RESPAWN; u.hp = 0; u.atkBuf = null;
  if (src && src.isPlayer && stats) stats.kills++;
  fx.push({ kind:'ring', x:u.x, y:u.y, r:6, max:50, t:0, life:.45, color:'#ffffff' });
  burst(u.x,24,u.y,u.b.color,22,190,.6,3.4); burst(u.x,24,u.y,'#ffffff',8,150,.4,2.4);
  const n = u.gems; u.gems = 0;
  for (let i=0;i<n;i++) gems.push({ x:u.x, y:u.y, vx:rnd(-90,90), vy:rnd(-90,90), age:0 });
}
function respawn(u) {
  const [x,y] = SPAWNS[u.team][u.idx];
  Object.assign(u, { x, y, hp:u.b.hp, ammo:3, reload:0, dead:false, flash:0, sup:0, pop:0, px:x, py:y });
  burst(x,10,y,'#ffffff',10,120,.4,2.4);

// ---------- movement / input ----------
function moveUnit(u, dx, dy, dt) {
  const len = Math.hypot(dx,dy); if (!len) return;
  const sp = u.b.speed * dt / Math.max(1,len);
  let nx = u.x + dx*sp;
  if (!hitsWall(nx,u.y,R-2) && nx>R && nx<W-R) u.x = nx;
  const ny = u.y + dy*sp;
  if (!hitsWall(u.x,ny,R-2) && ny>R && ny<H-R) u.y = ny;
}
function autoAng(u) { // nearest visible enemy, else keep facing
  const t = nearestEnemy(u); if (t) { lockTarget = t; return Math.atan2(t.y-u.y, t.x-u.x); } return u.ang;
}
function snapAng(u, ang, range) { // gentle aim assist for mouse
  let best=null, bd=.16;
  for (const e of units) { if (e.team===u.team || e.dead || !visibleTo(e,u.team)) continue;
    if (dist(u,e) > range*1.15) continue; const d = Math.abs(angDiff(ang, Math.atan2(e.y-u.y,e.x-u.x))); if (d<bd){ bd=d; best=e; } }
  if (best) { lockTarget = best; return Math.atan2(best.y-u.y,best.x-u.x); } return ang;
}
function playerInput(u, dt) {

  let dy = (keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if (touch.move) { const l = Math.hypot(touch.move.x-touch.move.sx, touch.move.y-touch.move.sy); dx = touch.move.x-touch.move.sx; dy = touch.move.y-touch.move.sy;
    if (l<8) dx=dy=0; else { const k = Math.min(1,l/40); dx = dx/l*k; dy = dy/l*k; } }
  const mvx = dx, mvy = dy; if (dx||dy) { const l = Math.hypot(dx,dy); if (l>1) { dx/=l; dy/=l; } }
  moveUnit(u, dx, dy, dt);

  const A = touch.atk, B = touch.sup;
  let manual = null;
  if (A && A.manual) { manual = A.ang; aimDisp = { kind:'atk', ang:A.ang }; }
  else if (B && B.manual) { manual = B.ang; aimDisp = { kind:'sup', ang:B.ang }; }
  if (A && !A.manual) autoAng(u);              // show lock ring while pressing
  if (B && !B.manual) autoAng(u);
  let atkReq = null, supReq = null;
  if (touch.pendAtk) { atkReq = touch.pendAtk.manual ? touch.pendAtk.ang : autoAng(u); touch.pendAtk = null; }
  if (touch.pendSup) { supReq = touch.pendSup.manual ? touch.pendSup.ang : autoAng(u); touch.pendSup = null; }
  const usingMouse = !touch.on || mouse.moved;
  if (!touch.on || mouse.down) {
    const ma = Math.atan2(mouse.y-u.y, mouse.x-u.x), sa = snapAng(u, ma, u.b.atk.range);
    if (!manual && state==='play') aimDisp = { kind:'atk', ang:sa, faint:true };
    if (mouse.down) atkReq = sa;
  }
  if (keys.e) atkReq = autoAng(u);
  if (superQueued) { superQueued = false; const ma = Math.atan2(mouse.y-u.y, mouse.x-u.x);
    supReq = (!touch.on || mouse.moved) ? snapAng(u, ma, u.b.sup.range||u.b.sup.radius||300) : autoAng(u); }
  // facing
  if (manual!==null) u.ang = manual;

}
function botThink(u, dt) {
  u.botT -= dt;
  const foes = units.filter(e=>e.team!==u.team && !e.dead && visibleTo(e,u.team));
  let tgt=null, best=1e9;
  for (const e of foes){ const d=dist(e,u); if (d<best && lineClear(u,e)){best=d;tgt=e;} }
  const atkRange = u.b.atk.range;
  let gx=u.x, gy=u.y;
  const nearGem = gems.reduce((m,g)=> (!m||dist(g,u)<dist(m,u))?g:m, null);
  const myGems = teamGems(u.team), enGems = teamGems(1-u.team);
  if (u.gems >= 3 && tgt && best < 260) { gx = SPAWNS[u.team][1][0]; gy = u.y + (u.y<360?60:-60); }
  else if (tgt && best < atkRange*0.9 && u.b.id!=='boulder') {
    const a = Math.atan2(u.y-tgt.y, u.x-tgt.x) + 0.5*u.strafe; gx = u.x + Math.cos(a)*100; gy = u.y + Math.sin(a)*100;
  } else if (tgt && (u.b.id==='boulder' || myGems < enGems || best > atkRange)) { gx = tgt.x; gy = tgt.y; }
  else if (nearGem && u.gems < 6) { gx = nearGem.x; gy = nearGem.y; }
  else { gx = W/2 + (u.team?50:-50); gy = H/2 + (u.idx-1)*90; }
  if (u.botT <= 0) { u.botT = rnd(.4,1); u.strafe = Math.random()<.5?1:-1; }
  let dx = gx-u.x, dy = gy-u.y; const l = Math.hypot(dx,dy)||1; dx/=l; dy/=l;
  const probe = a=>!hitsWall(u.x+Math.cos(a)*28, u.y+Math.sin(a)*28, R);
  const a0 = Math.atan2(dy,dx); let pick = null;
  for (const off of [0,.6,-.6,1.2,-1.2,1.9,-1.9]) { if (probe(a0+off)) { pick=a0+off; break; } }
  if (l > 14 && pick!==null) moveUnit(u, Math.cos(pick), Math.sin(pick), dt);
  if (tgt) {
    u.ang = Math.atan2(tgt.y-u.y, tgt.x-u.x);
    if (best < atkRange && u.ammo>=1 && u.shootCd<=0) { fire(u,u.ang+rnd(-.08,.08),false); u.shootCd=rnd(.35,.7); }
    const sr = u.b.sup.range || u.b.sup.radius || 200;

function update(dt) {
  if (state==='intro') { introT -= dt; if (introT<=0) state='play'; for (const u of units) u.pop = Math.min(1,u.pop+dt*1.5); return; }
  if (state!=='play') return;
  timeLeft -= dt; shake = Math.max(0, shake - dt*30);
  for (const u of units) {
    u.shootCd -= dt; u.flash = Math.max(0,u.flash-dt);
    if (u.dead) { u.respT -= dt; if (u.respT<=0) respawn(u); continue; }
    if (u.ammo<3){ u.reload += dt; if (u.reload >= u.b.reload/3){ u.reload=0; u.ammo++; } }
    if (u.isPlayer) playerInput(u,dt); else botThink(u,dt);
    for (const o of units) if (o!==u && !o.dead) {
      const d = dist(u,o); if (d < R*2 && d > 0) {
        const px = (u.x-o.x)/d*(R*2-d)*.5, py = (u.y-o.y)/d*(R*2-d)*.5;
        if (!hitsWall(u.x+px,u.y,R-2)) u.x+=px; if (!hitsWall(u.x,u.y+py,R-2)) u.y+=py;
      }
    }
  }
  if (units[0].dead) { aimDisp = null; lockTarget = null; touch.pendAtk = touch.pendSup = null; superQueued = false; }
  for (const b of bullets) {
    const sx = b.vx*dt, sy = b.vy*dt; b.x+=sx; b.y+=sy; b.d+=Math.hypot(sx,sy);
    if (b.d>b.range || b.x<0||b.x>W||b.y<0||b.y>H) b.dead = true;
    else if (hitsWall(b.x,b.y,b.r*.5)) { b.dead = true; burst(b.x,22,b.y,'#d9c3a0',5,100,.25,2); fx.push({kind:'ring',x:b.x,y:b.y,r:2,max:14,t:0,life:.2,color:'#ffffff'}); }
    if (!b.dead) for (const u of units) {
      if (u.team===b.team || u.dead || b.hit.has(u)) continue;
      if (Math.hypot(u.x-b.x,u.y-b.y) < R+b.r) { damage(u, b.owner, b.dmg); b.hit.add(u); if (!b.pierce) { b.dead = true; break; } }

  if (gemTimer<=0 && gems.length < 14) { gemTimer = 3.2; const a = rnd(0,Math.PI*2); gems.push({ x:W/2, y:H/2, vx:Math.cos(a)*140, vy:Math.sin(a)*140, age:0 }); burst(W/2,40,H/2,'#c27bff',8,90,.4,2.4); }
  for (const g of gems) {
    g.age += dt;

  }

}
function endMatch(winner) {

  const T = document.getElementById('endTitle');

  document.getElementById('endStats').innerHTML =
    `<div><small>Gems team</small><b>${teamGems(0)} : ${teamGems(1)}</b></div><div><small>Jouw gems</small><b>${stats.gems}</b></div><div><small>KO's</small><b>${stats.kills}</b></div><div><small>Schade</small><b>${Math.round(stats.dmg)}</b></div>`;
  document.getElementById('end').classList.remove('hidden');

// =====================================================================
//  INPUT
// =====================================================================
addEventListener('keydown', e=>{ const k=e.key.toLowerCase(); keys[k]=true; if (k===' ' && state==='play') { superQueued=true; e.preventDefault(); } });
addEventListener('keyup', e=>{ keys[e.key.toLowerCase()]=false; });
document.addEventListener('contextmenu', e=>e.preventDefault());
function onBtn(L, x, y) { for (const k of ['sup','atk']) { const b = L[k]; if (Math.hypot(x-b.x,y-b.y) <= b.r*1.2 + 10) return k; } return null; }
addEventListener('pointermove', e=>{
  if (e.pointerType==='mouse') { mouse.cx=e.clientX; mouse.cy=e.clientY; mouse.moved = true; return; }

  for (const k of ['move','atk','sup']) { const t = touch[k]; if (t && t.id===e.pointerId) { t.x=e.clientX; t.y=e.clientY;

}, { passive:true });
addEventListener('pointerdown', e=>{
  if (e.target.closest?.('button') || e.target.closest?.('.card')) return;
  if (e.pointerType==='mouse') { mouse.cx=e.clientX; mouse.cy=e.clientY; if (state!=='play') return; if (e.button===2) superQueued=true; else mouse.down=true; return; }

function pointerEnd(e) {
  if (e.pointerType==='mouse') { mouse.down=false; return; }
  if (touch.move && touch.move.id===e.pointerId) touch.move=null;
  if (touch.atk && touch.atk.id===e.pointerId) { if (e.type==='pointerup' && state==='play') touch.pendAtk = { manual:touch.atk.manual, ang:touch.atk.ang }; touch.atk=null; }

addEventListener('pointerup', pointerEnd); addEventListener('pointercancel', pointerEnd);

  document.getElementById('info').innerHTML = `<h2 class="ink">${b.name}</h2><div class="role">${b.role}</div>${bar('Levens',b.stats.hp)}${bar('Snelheid',b.stats.speed)}${bar('Bereik',b.stats.range)}${bar('Schade',b.stats.dmg)}<p>${b.desc}</p>`;

document.getElementById('play').onclick = startMatch;

// =====================================================================
//  LOOP
// =====================================================================
let last = performance.now();
function frame(now) {

    else { if (state==='play') updateMouseWorld(); update(dt); render3D(dt, now/1000); }

  } catch (e) { console.error(e); }

}

showMenu();
requestAnimationFrame(frame);

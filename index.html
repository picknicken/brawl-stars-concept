<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Arena Brawlers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root { color-scheme:dark; --bg:#14102e; --ink:#0b0820; --panel:#2a2468; --panel2:#3d34a0; --accent:#ffd23a; --accent2:#ff9a1f; --blue:#3da5ff; --red:#ff5a5a; --mute:#cfc8ff; --good:#46e06a;
          --font:'Lilita One','Arial Black','Trebuchet MS',system-ui,sans-serif; --safe-t:env(safe-area-inset-top,0px); --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px); --safe-b:env(safe-area-inset-bottom,0px); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:#fff; font-family:var(--font); overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; display:block; }
  #c { filter:saturate(1.14) contrast(1.05); }
  #hud { pointer-events:none; }
  .overlay { position:fixed; inset:0; z-index:3; pointer-events:none; }
  .overlay.hidden, .hidden { display:none !important; }
  .overlay > * { pointer-events:auto; }
  .ink { text-shadow:0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
  svg.ic { width:1em; height:1em; fill:currentColor; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; vertical-align:-.14em; flex:none; }
  .panel { background:linear-gradient(180deg,var(--panel2),var(--panel)); border:4px solid var(--ink); border-radius:16px; box-shadow:0 6px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.18); }
  .c-coin { color:#ffc93a; } .c-en { color:#ff5fd0; } .c-cr { color:#58e0ff; } .c-tr { color:#ffd23a; }

  /* ---- buttons ---- */
  .btn { font-family:var(--font); font-size:clamp(18px,3.4vw,28px); padding:.42em 1.4em; border:4px solid var(--ink); border-radius:14px; background:linear-gradient(180deg,#ffe35a,#ffb41f); color:#3a2000; cursor:pointer;
    box-shadow:0 6px 0 #a25a00, 0 9px 0 var(--ink), inset 0 2px 0 #fff8; text-shadow:0 2px 0 #fff6; transition:filter .12s, transform .08s; }
  .btn:hover { filter:brightness(1.08); } .btn:active { transform:translateY(4px); box-shadow:0 2px 0 #a25a00, 0 5px 0 var(--ink); }
  .btn.alt { background:linear-gradient(180deg,#8fb7ff,#4a7df0); color:#fff; box-shadow:0 6px 0 #1f3f9a, 0 9px 0 var(--ink), inset 0 2px 0 #fff6; text-shadow:0 2px 0 var(--ink); }
  .btn.green { background:linear-gradient(180deg,#7dff8a,#2fc24a); color:#06300f; box-shadow:0 6px 0 #1b7a2c, 0 9px 0 var(--ink), inset 0 2px 0 #fff8; }
  .btn.small { font-size:clamp(14px,2.2vw,19px); padding:.3em 1em; border-width:3px; box-shadow:0 4px 0 #a25a00, 0 6px 0 var(--ink), inset 0 2px 0 #fff8; border-radius:11px; }
  .btn.small.green { box-shadow:0 4px 0 #1b7a2c, 0 6px 0 var(--ink), inset 0 2px 0 #fff8; } .btn.small.alt { box-shadow:0 4px 0 #1f3f9a, 0 6px 0 var(--ink), inset 0 2px 0 #fff6; }
  .btn[disabled], .btn.off { filter:grayscale(.85) brightness(.75); cursor:default; }
  .btn.pulse { animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.045); } }
  .round { width:40px; height:40px; padding:0; border:3px solid var(--ink); border-radius:50%; background:linear-gradient(180deg,var(--panel2),var(--panel)); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.2); }
  .round:hover { filter:brightness(1.15); } .round:active { transform:translateY(2px); }
  .round[hidden] { display:none; }
  #topBtns { position:fixed; z-index:8; right:max(12px,var(--safe-r)); top:max(10px,var(--safe-t)); display:flex; gap:8px; align-items:center; }
  .curs { display:flex; gap:6px; margin-right:4px; }
  .cur { display:flex; align-items:center; gap:6px; padding:3px 12px 3px 6px; background:rgba(10,6,34,.78); border:3px solid var(--ink); border-radius:999px; font-size:clamp(14px,2.3vw,19px); min-width:62px; }
  .cur .ic { font-size:1.25em; filter:drop-shadow(0 2px 0 var(--ink)); } .cur b { font-weight:400; }

  /* ---- hub ---- */
  #hub { background:linear-gradient(180deg, rgba(12,8,40,.78) 0%, rgba(12,8,40,0) 24%, rgba(12,8,40,0) 55%, rgba(12,8,40,.88) 100%), radial-gradient(ellipse at center, rgba(0,0,0,0) 45%, rgba(8,5,30,.5) 100%); animation:fadein .35s ease-out; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
  #profile { position:absolute; left:max(12px,var(--safe-l)); top:max(10px,var(--safe-t)); display:flex; align-items:center; gap:10px; padding:5px 14px 5px 6px; border-radius:16px; min-width:min(230px,46vw); }
  #profile .tbadge { width:clamp(34px,6vw,46px); height:clamp(34px,6vw,46px); border-radius:12px; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 35% 30%,#ffe98a,#e29a10); border:3px solid var(--ink); color:#6a3c00; font-size:clamp(20px,3.6vw,28px); }
  #profile .pname { font-size:clamp(13px,2.2vw,17px); line-height:1; } #profile .pname small { display:block; color:var(--mute); font-size:.7em; margin-top:2px; }
  #profile .ptr { font-size:clamp(15px,2.6vw,21px); line-height:1.1; color:#ffd23a; }
  .xpbar { height:9px; background:#150f3a; border:2px solid var(--ink); border-radius:6px; overflow:hidden; margin-top:3px; width:100%; min-width:110px; } .xpbar i { display:block; height:100%; background:linear-gradient(90deg,#ffb41f,#ffe35a); }
  .rail { position:absolute; display:flex; flex-direction:column; gap:8px; top:calc(max(10px,var(--safe-t)) + clamp(62px,min(13vw,22vh),90px)); }
  #railL { left:max(12px,var(--safe-l)); } #railR { right:max(12px,var(--safe-r)); }
  .rbtn { position:relative; width:clamp(58px,10vw,76px); padding:6px 2px 4px; border:3px solid var(--ink); border-radius:13px; text-align:center; cursor:pointer; background:linear-gradient(180deg,var(--panel2),var(--panel)); box-shadow:0 4px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.18); font-size:clamp(10px,1.7vw,12px); transition:transform .1s, filter .12s; }
  .rbtn:hover { filter:brightness(1.12); } .rbtn:active { transform:translateY(2px); }
  .rbtn .ic { display:block; margin:0 auto 2px; font-size:clamp(22px,4.4vw,30px); }
  .dot { position:absolute; right:-6px; top:-7px; min-width:20px; height:20px; padding:0 5px; border-radius:999px; background:#ff3b3b; border:2px solid var(--ink); font-size:12px; line-height:16px; text-align:center; }
  #heroTag { position:absolute; left:50%; transform:translateX(-50%); top:calc(max(10px,var(--safe-t)) + clamp(54px,min(11vw,19vh),84px)); text-align:center; }
  #heroTag h2 { margin:0; font-weight:400; font-size:clamp(24px,5vw,40px); }
  .chips { display:flex; gap:6px; justify-content:center; margin-top:3px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:4px; padding:1px 10px 1px 7px; border:2px solid var(--ink); border-radius:999px; background:rgba(10,6,34,.8); font-size:clamp(12px,2vw,16px); }
  .arrow { position:absolute; top:50%; transform:translateY(-50%); width:clamp(40px,7vw,54px); height:clamp(40px,7vw,54px); font-size:clamp(22px,4vw,30px); }
  #arrL { left:calc(50% - clamp(120px,20vw,200px)); } #arrR { right:calc(50% - clamp(120px,20vw,200px)); }
  #hubBottom { position:absolute; left:0; right:0; bottom:max(12px,var(--safe-b)); display:flex; align-items:flex-end; justify-content:space-between; gap:12px; padding:0 max(14px,var(--safe-r)) 0 max(14px,var(--safe-l)); }
  #modeBtn { display:flex; align-items:center; gap:10px; padding:8px 14px; cursor:pointer; min-width:min(260px,40vw); transition:filter .12s; } #modeBtn:hover { filter:brightness(1.1); }
  #modeBtn .mi { font-size:clamp(28px,5vw,40px); color:#c9a6ff; display:flex; } #modeBtn b { font-weight:400; font-size:clamp(15px,2.8vw,22px); display:block; line-height:1.05; } #modeBtn small { font-size:clamp(11px,1.8vw,13px); color:var(--mute); }
  #play { font-size:clamp(24px,4.6vw,38px); padding:.34em 1.7em; }
  #freeBtn { animation:pulse 1.6s ease-in-out infinite; border-color:#2fc24a; background:linear-gradient(180deg,#5fe07a,#2a9a44); color:#06300f; }

  /* ---- generic screens ---- */
  #scr { background:linear-gradient(180deg, rgba(14,9,46,.93), rgba(14,9,46,.82)); display:flex; flex-direction:column; animation:fadein .2s ease-out; }
  #scr.detail { background:linear-gradient(90deg, rgba(14,9,46,.9) 0%, rgba(14,9,46,.2) 34%, rgba(14,9,46,0) 50%, rgba(14,9,46,.2) 66%, rgba(14,9,46,.9) 100%); }
  .shead { display:flex; align-items:center; gap:12px; padding:max(10px,var(--safe-t)) 12px 6px max(12px,var(--safe-l)); flex:none; }
  .shead h2 { margin:0; font-weight:400; font-size:clamp(24px,5vw,38px); } .shead .sub { color:var(--mute); font-size:clamp(11px,1.9vw,14px); margin-left:4px; }
  .tabs { display:flex; gap:6px; margin:0 0 10px 2px; flex-wrap:wrap; }
  .tab { border:3px solid var(--ink); border-radius:11px; padding:3px 14px; font-size:clamp(13px,2.2vw,18px); cursor:pointer; background:linear-gradient(180deg,var(--panel2),var(--panel)); box-shadow:0 3px 0 rgba(0,0,0,.35); } .tab.sel { background:linear-gradient(180deg,#ffe35a,#ffb41f); color:#3a2000; }
  .sbody { flex:1; min-height:0; overflow:auto; padding:6px max(14px,var(--safe-r)) max(14px,var(--safe-b)) max(14px,var(--safe-l)); touch-action:pan-x pan-y; -webkit-overflow-scrolling:touch; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(120px,21vw,170px),1fr)); gap:clamp(8px,1.6vw,14px); }
  .bcard { position:relative; padding:6px; cursor:pointer; text-align:center; transition:transform .12s, filter .12s; }
  .bcard:hover { filter:brightness(1.1); transform:translateY(-3px); }
  .bcard img { width:100%; display:block; border-radius:9px; border:3px solid var(--ink); background:#2a2468; }
  .bcard b { display:block; font-weight:400; font-size:clamp(14px,2.4vw,19px); margin-top:4px; }
  .bcard .row2 { display:flex; justify-content:center; gap:6px; margin-top:2px; }
  .bcard .lv { position:absolute; left:-4px; top:-6px; background:linear-gradient(180deg,#d98cff,#8a3fe0); border:2px solid var(--ink); border-radius:999px; padding:0 8px; font-size:13px; line-height:19px; }
  .bcard.locked img { filter:grayscale(.9) brightness(.55); } .bcard .lock { position:absolute; left:0; right:0; top:22%; font-size:clamp(28px,6vw,44px); color:#fff; filter:drop-shadow(0 3px 0 var(--ink)); }
  .bcard.sel { border-color:var(--accent); }
  .side { padding:12px 14px; } .side h3 { margin:0 0 6px; font-weight:400; font-size:clamp(16px,2.8vw,22px); }
  .stat { display:grid; grid-template-columns:20px minmax(54px,70px) 1fr auto; align-items:center; gap:6px; font-size:12px; margin:5px 0; color:#d8d3ff; }
  .stat .ic { font-size:15px; } .stat.hp .ic { color:#ff7a8a; } .stat.sp .ic { color:#ffd23a; } .stat.rg .ic { color:#7ff3ff; } .stat.dm .ic { color:#ff9a4a; } .stat em { font-style:normal; color:#fff; }
  .bar { height:10px; background:#150f3a; border-radius:6px; overflow:hidden; border:2px solid var(--ink); } .bar i { display:block; height:100%; background:linear-gradient(90deg,#46e06a,#b6f23a); transform-origin:left; animation:grow .5s ease-out; }
  @keyframes grow { from { transform:scaleX(0); } }
  .muted { color:var(--mute); font-family:system-ui,sans-serif; font-size:12px; line-height:1.4; }
  #detailGrid { display:grid; grid-template-columns:minmax(210px,31vw) 1fr minmax(210px,31vw); gap:12px; height:100%; }
  #detailGrid > .mid { pointer-events:none; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; }
  .detailL, .detailR { display:flex; flex-direction:column; gap:10px; min-height:0; overflow:auto; }
  .lvdots { display:flex; gap:4px; margin:6px 0; } .lvdots i { flex:1; height:12px; border:2px solid var(--ink); border-radius:4px; background:#150f3a; } .lvdots i.on { background:linear-gradient(180deg,#d98cff,#8a3fe0); }
  .cost { display:inline-flex; align-items:center; gap:3px; margin:0 4px; } .cost .ic { font-size:1.15em; }
  .skins { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .skin { position:relative; padding:4px; cursor:pointer; text-align:center; border:3px solid var(--ink); border-radius:12px; background:#231c58; font-size:12px; }
  .skin img { width:100%; display:block; border-radius:8px; border:2px solid var(--ink); } .skin.sel { border-color:var(--accent); box-shadow:0 0 0 2px #ffd23a55; }
  .skin.locked img { opacity:.6; } .skin .rb { height:5px; border-radius:3px; margin:3px 2px 2px; } .skin .eq { position:absolute; right:-5px; top:-6px; background:var(--good); color:#06300f; border:2px solid var(--ink); border-radius:50%; width:20px; height:20px; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .shop { display:grid; grid-template-columns:repeat(auto-fill,minmax(clamp(130px,23vw,190px),1fr)); gap:12px; }
  .scard { padding:8px; text-align:center; position:relative; } .scard img { width:100%; border-radius:9px; border:3px solid var(--ink); display:block; } .scard b { font-weight:400; display:block; font-size:clamp(14px,2.4vw,18px); margin:4px 0 2px; }
  .scard .rbar { height:6px; border-radius:3px; margin:2px 0 6px; } .scard svg.chestsvg { width:70%; margin:4px auto; display:block; }
  .rtag { font-size:11px; letter-spacing:.5px; opacity:.9; }
  .quest { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; padding:10px 14px; margin-bottom:10px; } .quest .qi { font-size:clamp(28px,5vw,40px); color:#ffd23a; }
  .quest b { font-weight:400; font-size:clamp(15px,2.6vw,20px); display:block; } .qbar { height:16px; background:#150f3a; border:3px solid var(--ink); border-radius:9px; overflow:hidden; margin-top:4px; position:relative; }
  .qbar i { display:block; height:100%; background:linear-gradient(90deg,#46b8ff,#8fe3ff); } .qbar span { position:absolute; inset:0; text-align:center; font-size:11px; line-height:11px; text-shadow:0 1px 0 var(--ink); }
  .track { display:flex; gap:14px; padding:16px 6px 20px; align-items:flex-start; min-width:max-content; position:relative; }
  .track::before { content:''; position:absolute; left:0; right:0; top:78px; height:10px; background:linear-gradient(180deg,#ffd44a,#ff9a1f); border:3px solid var(--ink); border-radius:6px; z-index:0; }
  .node { position:relative; z-index:1; width:clamp(92px,15vw,118px); text-align:center; }
  .node .rw { height:clamp(74px,14vw,92px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:default; padding:4px; } .node.ready .rw { cursor:pointer; box-shadow:0 0 0 3px #7dff8a, 0 0 18px #7dff8a99; animation:pulse 1.6s infinite; } .node.done .rw { filter:brightness(.7) saturate(.6); }
  .node .rw .big { font-size:clamp(24px,5vw,34px); } .node .rw small { font-size:11px; } .node img { width:42px; border-radius:7px; border:2px solid var(--ink); }
  .node .num { margin:10px auto 4px; width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe98a,#e29a10); border:3px solid var(--ink); color:#4a2c00; line-height:28px; font-size:15px; } .node.done .num { background:var(--good); }
  .node .chk { position:absolute; right:-4px; top:-10px; font-size:24px; color:#46e06a; filter:drop-shadow(0 2px 0 var(--ink)); }
  .pbar { max-width:460px; } .toast { position:fixed; z-index:20; left:50%; bottom:calc(max(14px,var(--safe-b)) + 70px); transform:translateX(-50%); padding:8px 18px; border-radius:999px; font-size:clamp(14px,2.6vw,19px); animation:toast 2.2s both; pointer-events:none; }
  @keyframes toast { 0% { opacity:0; transform:translate(-50%,10px); } 12%,80% { opacity:1; transform:translate(-50%,0); } 100% { opacity:0; transform:translate(-50%,-6px); } }

  /* ---- popup / settings / pause ---- */
  #popup { background:rgba(10,8,30,.7); display:flex; align-items:center; justify-content:center; z-index:9; }
  #popup .box { width:min(420px,92vw); padding:14px 16px; max-height:92vh; overflow:auto; } #popup h3, #settings h3 { margin:8px 0 4px; font-weight:400; font-size:12px; color:var(--mute); letter-spacing:1.5px; } #popup h3:first-child, #settings h3:first-child { margin-top:0; }
  .modecard { display:grid; grid-template-columns:auto 1fr; align-items:center; align-content:center; gap:2px 10px; padding:8px 11px; margin-bottom:6px; border:3px solid var(--ink); border-radius:12px; cursor:pointer; background:linear-gradient(180deg,var(--panel2),var(--panel)); box-shadow:0 3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.16); }
  .modecard .mi { grid-row:1 / span 2; font-size:32px; color:#c9a6ff; display:flex; } .modecard b { font-weight:400; font-size:18px; line-height:1.05; } .modecard small { font-size:12px; color:var(--mute); font-family:system-ui,sans-serif; }
  .modecard.sel { background:linear-gradient(180deg,#ffe35a,#ffb41f); color:#3a2000; } .modecard.sel .mi { color:#7a3fe0; } .modecard.sel small { color:#6a4300; }
  .pills { display:flex; gap:5px; } .pill { flex:1; border:3px solid var(--ink); border-radius:11px; padding:5px 6px; font-size:15px; text-align:center; cursor:pointer; background:linear-gradient(180deg,var(--panel2),var(--panel)); box-shadow:0 3px 0 rgba(0,0,0,.35); white-space:nowrap; min-width:0; }
  .pill.sel { background:linear-gradient(180deg,#ffe35a,#ffb41f); color:#3a2000; }
  #settings { position:fixed; z-index:9; right:max(12px,var(--safe-r)); top:calc(max(10px,var(--safe-t)) + 52px); width:220px; padding:10px 12px; display:none; } #settings.open { display:block; animation:fadein .15s; }
  #help { font-family:system-ui,sans-serif; font-size:11px; line-height:1.5; color:var(--mute); margin-top:8px; }
  #pause { background:rgba(10,8,30,.78); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; } #pause h1 { margin:0; font-weight:400; font-size:clamp(40px,10vw,84px); color:var(--accent); text-shadow:0 6px 0 #a25a00, 0 9px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink); }

  /* ---- end screen ---- */
  #end { padding-left:44% !important; background:linear-gradient(90deg, rgba(10,8,30,0) 0%, rgba(10,8,30,0) 36%, rgba(10,8,30,.82) 58%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:10px; }
  #endRibbon { position:relative; padding:.05em 1.2em; animation:ribbon .6s cubic-bezier(.2,1.4,.4,1) both; }
  #endRibbon::before { content:''; position:absolute; inset:8% -6%; background:linear-gradient(180deg,var(--rc1,#ffd23a),var(--rc2,#ff9a1f)); border:5px solid var(--ink); border-radius:10px; box-shadow:0 8px 0 rgba(0,0,0,.4); transform:skewX(-8deg); z-index:-1; }
  #endTitle { margin:0; font-weight:400; font-size:clamp(40px,10vw,92px); letter-spacing:2px; color:#fff; text-shadow:0 6px 0 var(--ink), 4px 0 0 var(--ink), -4px 0 0 var(--ink), 0 -4px 0 var(--ink); }
  @keyframes ribbon { from { transform:scale(.2) rotate(-6deg); opacity:0; } to { transform:none; opacity:1; } }
  #endMvp .mvp { display:flex; align-items:center; gap:10px; background:linear-gradient(180deg,#5a3cc8,#33237a); border:4px solid var(--ink); border-radius:12px; padding:3px 12px 3px 4px; box-shadow:0 4px 0 rgba(0,0,0,.35); animation:rise .5s .15s ease-out both; text-align:left; }
  #endMvp .mvp.foe { background:linear-gradient(180deg,#a83a4a,#6a1f2e); }
  #endMvp .mvpImg { width:46px; height:46px; border-radius:9px; overflow:hidden; flex:none; background:#2a2468; } #endMvp .mvpImg img { width:100%; height:100%; object-fit:cover; display:block; }

const SPAWNS = { 0:[[70,260],[70,360],[70,460]], 1:[[1130,260],[1130,360],[1130,460]] };

const cv = document.getElementById('c'), hud = document.getElementById('hud'), hctx = hud.getContext('2d');
let sel = 0, state = 'menu', units = [], bullets = [], gems = [], fx = [], texts = [];
let timeLeft = 0, holdT = 0, holdTeam = -1, gemTimer = 0, shake = 0, introT = 0, stats = null;
const keys = {}, mouse = { cx:innerWidth/2, cy:innerHeight/2, x:W/2, y:H/2, down:false, moved:false };

let superQueued = false, aimDisp = null, lockTarget = null;

let hitStop = 0, punch = 0, flashFx = null, endWin = -1;
function pushPopup(s, color) { popups.push({ s, color, t0:performance.now() }); }

let mode = 'gem', diff = 'normal', score = [0,0], ball = null, goalT = 0, goalTeam = -1, overtime = false, matchOver = -2, introTitle = '';

const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const angDiff = (a,b)=>{ let d=(b-a)%(Math.PI*2); if (d>Math.PI) d-=Math.PI*2; if (d<-Math.PI) d+=Math.PI*2; return d; };
function circleRect(x,y,r,[rx,ry,rw,rh]) {
  const cx = Math.max(rx, Math.min(x, rx+rw)), cy = Math.max(ry, Math.min(y, ry+rh));
  const dx = x-cx, dy = y-cy; return dx*dx+dy*dy < r*r;
}
function hitsWall(x,y,r){ return WALLS.some(w=>circleRect(x,y,r,w)); }
function inBush(u){ return BUSHES.some(b=>u.x>b[0]&&u.x<b[0]+b[2]&&u.y>b[1]&&u.y<b[1]+b[3]); }
function visibleTo(target, team) {
  if (target.team === team || !inBush(target)) return true;
  return units.some(u=>u.team===team && !u.dead && dist(u,target) < 120);
}
function lineClear(a,b) {
  const n = Math.ceil(dist(a,b)/12);
  for (let i=1;i<n;i++){ const t=i/n; if (hitsWall(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t, 3)) return false; }
  return true;
}
function nearestEnemy(u, maxD) {
  let t=null, b=maxD||1e9;
  for (const e of units) { if (e.team===u.team || e.dead || !visibleTo(e,u.team)) continue; const d=dist(u,e); if (d<b){ b=d; t=e; } }
  return t;
}

// =====================================================================
//  3D RENDERING
// =====================================================================
// =====================================================================
//  SOUND (procedural WebAudio: no audio files needed)
// =====================================================================
const Snd = (()=>{
  let ac=null, master=null, sfxG=null, musG=null, noiseBuf=null, muted=false, timer=null, step=0, nextT=0;
  try { muted = localStorage.getItem('ab_mute')==='1'; } catch(e) {}
  const T = ()=>ac.currentTime;
  function init() {
    if (ac) { if (ac.state==='suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e) { ac = null; return; }
    master = ac.createGain(); master.gain.value = muted?0:1; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = .9; sfxG.connect(master);
    musG = ac.createGain(); musG.gain.value = .13; musG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    nextT = T()+.1; timer = setInterval(sched, 80);
  }
  function tone(f, dur, type, vol, f2, delay, dest) {
    if (!ac) return;
    const t = T()+(delay||0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(f,t);
    if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol||.3), t+Math.min(.012,dur/3)); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
    o.connect(g); g.connect(dest||sfxG); o.start(t); o.stop(t+dur+.03);
  }
  function noise(dur, vol, freq, type, delay, dest) {
    if (!ac) return;
    const t = T()+(delay||0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = type||'lowpass'; f.frequency.setValueAtTime(freq||1200,t); f.frequency.exponentialRampToValueAtTime(Math.max(80,(freq||1200)*.35), t+dur);
    g.gain.setValueAtTime(vol||.3,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f); f.connect(g); g.connect(dest||sfxG); s.start(t, Math.random()*.5); s.stop(t+dur+.03);
  }
  // little looping beat: bass + lead + kick + hat
  const BASS = [55,0,55,0,65.4,0,55,0,73.4,0,73.4,0,65.4,0,49,0];
  const LEAD = [0,440,0,523,0,659,523,0, 0,587,0,523,0,440,392,0];
  function sched() {
    if (!ac || ac.state!=='running') return;
    while (nextT < T()+.3) {
      const dl = nextT-T(), i = step%16;
      if (BASS[i]) tone(BASS[i], .24, 'triangle', .55, null, dl, musG);
      if (LEAD[i]) tone(LEAD[i], .16, 'square', .1, null, dl, musG);
      if (i%4===0) tone(120, .14, 'sine', .8, 42, dl, musG);
      if (i%2===1) noise(.04, .12, 9000, 'highpass', dl, musG);
      nextT += .24; step++;
    }
    if (nextT < T()) nextT = T()+.1;
  }
  const S = {
    shoot_blaze:v=>{ noise(.16,.55*v,1900,'lowpass'); tone(160,.13,'sawtooth',.28*v,55); },
    shoot_bolt:v=>{ tone(1100,.2,'sawtooth',.2*v,180); noise(.06,.3*v,6000,'highpass'); },
    shoot_boulder:v=>{ noise(.22,.5*v,500,'lowpass'); tone(95,.22,'sine',.6*v,38); },
    shoot_frost:v=>{ tone(700,.22,'triangle',.3*v,1500); tone(1400,.18,'sine',.12*v,2200,.04); },
    shoot_melody:v=>{ tone(523,.22,'sine',.3*v,null); tone(784,.22,'sine',.22*v,null,.02); tone(1046,.2,'triangle',.1*v,null,.04); },
    shoot_shade:v=>{ noise(.07,.35*v,7000,'highpass'); tone(1500,.08,'square',.1*v,800); },
    hit:v=>{ noise(.07,.28*v,1400,'bandpass'); tone(230,.09,'square',.12*v,110); },
    kill:v=>{ noise(.4,.5*v,1800,'lowpass'); tone(320,.4,'sawtooth',.25*v,50); },
    gem:v=>{ tone(1250,.1,'sine',.26*v,1700); tone(1900,.13,'sine',.2*v,null,.07); },
    heal:v=>{ tone(660,.16,'sine',.22*v,990); },
    ready:v=>{ [660,880,1100,1320].forEach((f,i)=>tone(f,.14,'triangle',.22,null,i*.06)); },
    super:v=>{ noise(.45,.5*v,3500,'bandpass'); tone(180,.45,'sawtooth',.3*v,900); },
    kick:v=>{ noise(.1,.5*v,900,'lowpass'); tone(170,.12,'sine',.7*v,60); },
    goal:v=>{ tone(220,1.1,'sawtooth',.28,null); tone(223,1.1,'sawtooth',.28,null); tone(440,1.1,'square',.1,null); [523,659,784,1046].forEach((f,i)=>tone(f,.22,'square',.14,null,.25+i*.12)); },
    respawn:v=>{ tone(400,.2,'sine',.25*v,900); },
    beep:v=>{ tone(880,.14,'sine',.35,null); },
    go:v=>{ tone(1320,.36,'triangle',.4,null); tone(1980,.3,'sine',.18,null,.02); },
    click:v=>{ tone(900,.05,'square',.12,500); },
    win:v=>{ [523,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.2,null,i*.13)); },
    lose:v=>{ [392,370,349,330].forEach((f,i)=>tone(f,.3,'sawtooth',.18,null,i*.2)); },
  };

// ---- build one character ----
function buildCharProc(u) {
  const b = u.b, id = b.id, skinDef = u.skin ? skinById(u.skin) : null, rec = skinDef ? SKIN_RECIPES[skinDef.id] : null;
  const pal = Object.assign({}, PAL[id], rec && rec.pal), ctx = makeCtx(id, pal, skinDef);
  const { root, rig } = ctx, teamCol = u.team===0 ? '#3da5ff' : '#ff5a5a';
  const ring = new THREE.Mesh(new THREE.RingGeometry(18,23,44), new THREE.MeshBasicMaterial({ color:teamCol, side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI/2; ring.position.y = 1; root.add(ring);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(18,44), new THREE.MeshBasicMaterial({ color:teamCol, transparent:true, opacity:.28, side:THREE.DoubleSide }));
  disc.rotation.x = -Math.PI/2; disc.position.y = .8; root.add(disc);
  const blob = new THREE.Mesh(new THREE.CircleGeometry(15,24), new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.3, depthWrite:false }));
  blob.rotation.x = -Math.PI/2; blob.position.y = .5; root.add(blob);
  buildSkeleton(ctx); BASE[id](ctx);
  if (rec) { for (const t of rec.hide||[]) hideTag(ctx,t); for (const a of rec.acc||[]) ACC[a](ctx); if (rec.fx) ctx.fx = rec.fx; }
  scene.add(root);
  const hl = ctx.face.eyes.length;
  root.userData = { rig, body:ctx.body, torso:ctx.torso, head:ctx.head, legL:ctx.legL, legR:ctx.legR, armL:ctx.armL, armR:ctx.armR, gun:ctx.gun, flash:ctx.flash, ring, disc, id, S:ctx.scale||CFG[id].S,
    gunBase:ctx.gun.position.x, chains:ctx.chains, wings:ctx.wings, floats:ctx.floats, glows:ctx.glows, face:ctx.face, hover:ctx.hover, fx:ctx.fx, blinkT:rnd(1,4), blink:0 };
  return root;
}

// ---- GLB characters first, procedural as fallback ----
function buildChar(u) {
  const sk = u.skin ? skinById(u.skin) : null, spec = glbSpec(u.b.id, sk);
  return glbReady(spec) ? buildCharGLB(u, spec) : buildCharProc(u);
}

// ---- animation ----
function animateChar(u, m, dt, t) {
  const d = m.userData;
  if (d.glb) return animateGLB(u, m, dt, t);
  const moved = Math.hypot(u.x-(u.px??u.x), u.y-(u.py??u.y)); u.px = u.x; u.py = u.y;
  u.phase = (u.phase||0) + (moved>.15 ? dt*(d.id==='boulder'?9:13) : 0);
  u.recoil = Math.max(0,(u.recoil||0) - dt*(d.id==='boulder'?5:7));
  u.pop = Math.min(1,(u.pop??1) + dt*4);
  const walk = moved>.15 ? 1 : 0, sw = Math.sin(u.phase), idle = Math.sin(t*2.6+u.team*2+(u.idx||0));
  if (walk && dt>0) { u.dustT = (u.dustT||0)-dt; if (u.dustT<=0) { u.dustT = .17; if (!d.hover) burst(u.x,2,u.y,'#e6cf94',2,26,.45,2.6,40); } }
  u.vang = u.vang===undefined ? u.ang : u.vang + angDiff(u.vang,u.ang)*Math.min(1,dt*16);
  m.position.set(u.x,0,u.y); m.rotation.y = -u.vang;
  const pop = 1-Math.pow(1-u.pop,3); m.scale.setScalar(.25+.75*pop);
  d.rig.position.y = d.hover + Math.abs(sw)*3.2*walk*(d.hover?.3:1) + (idle*.5 + (d.hover?Math.sin(t*2.2)*1.6:0))*(1-walk);
  d.rig.rotation.z = -sw*.06*walk + u.recoil*.07;
  d.body.rotation.x = sw*.05*walk;
  d.legL.rotation.z = sw*.75*walk; d.legR.rotation.z = -sw*.75*walk;
  d.head.rotation.z = idle*.03 - u.recoil*.06; d.head.position.y = 38 + Math.abs(sw)*.8*walk + idle*.3;
  if (d.id==='boulder') {
    const k = u.recoil;
    d.armL.rotation.z = 1.0 + sw*.18*walk + k*.7; d.armR.rotation.z = 1.0 - sw*.18*walk + k*.7;
    d.armL.scale.y = d.armR.scale.y = 1 + k*.55; d.armL.rotation.y = .18; d.armR.rotation.y = -.18;
  } else {
    d.armR.rotation.z = 1.15 - u.recoil*.28; d.armR.rotation.y = -.12;
    d.armL.rotation.z = -sw*.85*walk + idle*.04; d.armL.rotation.y = 0;
    d.gun.position.x = d.gunBase - u.recoil*5; d.gun.rotation.z = u.recoil*.12;
  }
  // chains (scarves, hair, tails, capes), wings, orbiting orbs, glows
  for (const c of d.chains) for (let i=0;i<c.groups.length;i++)
    c.groups[i].rotation.z = (i===0?c.base:0) + Math.sin(t*c.spd - i*.9 + c.ph)*c.amp*(.6+i*.25) - walk*c.lean*(i===0?.55:.22) - (i===0?u.recoil*.12:0);

    } else if (s.type === 'burst') {

function rankInfo(n) { let i = 0; for (let k=0;k<RANKS.length;k++) if (n>=RANKS[k][1]) i = k; const nx = RANKS[i+1]; return { name:RANKS[i][0], min:RANKS[i][1], next:nx?nx[1]:null }; }
const passTier = ()=>Math.min(PASS_N, Math.floor(SAVE.xp/PASS_XP));
const questsReady = ()=>{ ensureQuests(); return SAVE.quests.list.filter(q=>q.p>=q.n && !q.claimed).length; };

// ---- result of a finished match ----
function recordMatch(winner) {
  const b = BRAWLERS[sel], won = winner===0, draw = winner===-1, cur = SAVE.tr.per[b.id]||0;
  const dTr = won ? 8 : draw ? 0 : -Math.min(5,cur); SAVE.tr.per[b.id] = cur+dTr;
  const coins = (won?40:draw?15:12) + stats.kills*(won?4:3), xp = won?80:draw?40:35;
  SAVE.coins += coins; SAVE.xp += xp;
  trackQuests({ matches:1, wins:won?1:0, kos:stats.kills, dmg:stats.dmg, gems:stats.gems, goals:stats.goals });
  const r = Math.random(); let tier = draw ? 'wood' : won ? (r<.1?'gold':r<.7?'silver':'wood') : (r<.25?'silver':'wood');
  if (SAVE.drops.length<15) SAVE.drops.push(tier); else tier = null;
  save(); refreshCurrencies(); return { dTr, coins, xp, tier };
}

function chestSVG(tier) {
  const T = TIERS[tier];
  return `<svg viewBox="0 0 120 100" class="chestsvg"><g class="glow"><circle cx="60" cy="40" r="46" fill="#ffe27a" opacity=".55"/></g><g class="base"><rect x="10" y="40" width="100" height="52" rx="8" fill="${T.c2}" stroke="#0b0820" stroke-width="5"/><rect x="10" y="54" width="100" height="9" fill="${T.c}" opacity=".55"/><rect x="48" y="45" width="24" height="22" rx="5" fill="#ffd23a" stroke="#0b0820" stroke-width="4"/><circle cx="60" cy="56" r="3.5" fill="#0b0820"/></g><g class="lid"><path d="M10 42 Q10 8 60 8 Q110 8 110 42 Z" fill="${T.c}" stroke="#0b0820" stroke-width="5" stroke-linejoin="round"/><path d="M26 36 Q30 18 60 16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/><rect x="52" y="32" width="16" height="14" rx="3" fill="#ffd23a" stroke="#0b0820" stroke-width="4"/></g></svg>`;
}
let dropState = null;
function rewardCard(r, i) {
  let inner, label, sub = '';
  if (r.t==='coins') { inner = `<div class="ric c-coin">${ic('coin')}</div>`; label = '+'+r.n; sub = r.dup ? 'Dubbel! Omgezet' : 'Munten'; }
  else if (r.t==='energy') { inner = `<div class="ric c-en">${ic('bolt')}</div>`; label = '+'+r.n; sub = 'Energie'; }
  else if (r.t==='crystals') { inner = `<div class="ric c-cr">${ic('crystal')}</div>`; label = '+'+r.n; sub = 'Kristallen'; }
  else if (r.t==='drop') { inner = `<div class="ric c-coin">${ic('chest')}</div>`; label = TIERS[r.tier].n; sub = 'Extra kist'; }
  else if (r.t==='skin') { const s = skinById(r.id), b = BRAWLERS.find(x=>x.id===s.b); inner = `<div class="ric">${imgFor(b, s?s.id:'')}</div>`; label = s.name; sub = `Nieuwe skin voor ${b.name}`; }
  else { const b = BRAWLERS.find(x=>x.id===r.id); inner = `<div class="ric">${imgFor(b, '')}</div>`; label = b.name; sub = 'NIEUWE KNOKKER!'; }
  return `<div class="rcard panel ${r.isNew?'new':''}" style="animation-delay:${.1+i*.16}s">${inner}<b>${label}</b><small>${sub}</small></div>`;
}
function renderDrop() {
  const d = dropState, el = $('dropScr');
  if (d.reveal) { el.innerHTML = `<div class="ttl ink">${d.title}</div><div class="rewards">${d.given.map(rewardCard).join('')}</div><button class="btn" data-act="dropNext">DOORGAAN</button>`; return; }
  if (d.stage===0) el.innerHTML = `<div class="ttl ink">${TIERS[d.tier].n}</div><div class="chest idle" data-act="dropOpen">${chestSVG(d.tier)}<div class="burst"></div></div><div class="muted">Tik om te openen</div>`;
  else el.innerHTML = `<div class="ttl ink">Beloningen!</div><div class="rewards">${d.given.map(rewardCard).join('')}</div><button class="btn" data-act="dropNext">${SAVE.drops.length?`VOLGENDE KIST (${SAVE.drops.length})`:'DOORGAAN'}</button>`;
}
function openDrops() { if (!SAVE.drops.length) { toast('Geen kisten. Win gevechten om kisten te verdienen!'); return; } startDrop(); }
function startDrop() { const tier = SAVE.drops.shift(); save(); dropState = { tier, rewards:rollDrop(tier), stage:0 }; renderDrop(); $('dropScr').classList.remove('hidden'); }
function showReveal(rewards, title) { dropState = { reveal:true, title, given:rewards.map(grant) }; renderDrop(); $('dropScr').classList.remove('hidden'); Snd.play('ready'); }
function updateEndDropBtn() { const b = document.querySelector('#endRewards .rew.drop'); if (b) { if (SAVE.drops.length) b.querySelector('b').textContent = `KISTEN OPENEN (${SAVE.drops.length})`; else b.remove(); } }

// ---- end screen ----
function showEndExtras(winner) {
  const r = recordMatch(winner), c = winner===0 ? ['#ffd23a','#ff9a1f'] : winner===1 ? ['#ff7a7a','#c93a3a'] : ['#b8b4d8','#7c78a8'], rib = $('endRibbon');
  rib.style.setProperty('--rc1',c[0]); rib.style.setProperty('--rc2',c[1]);
  $('endRewards').innerHTML = `<div class="rew panel ${r.dTr>0?'up':r.dTr<0?'down':''}"><span class="c-tr">${ic('trophy')}</span><b>${r.dTr>0?'+':''}${r.dTr}</b></div>`
    + `<div class="rew panel"><span class="c-coin">${ic('coin')}</span><b>+${r.coins}</b></div><div class="rew panel"><span class="c-en">${ic('bolt')}</span><b>+${r.xp} XP</b></div>`
    + (SAVE.drops.length ? `<div class="rew drop panel" data-act="drops">${ic('chest')}<b>KISTEN OPENEN (${SAVE.drops.length})</b></div>` : '');
}

// ---- actions (event delegation) ----
const ACT = {
  back() { closeScreen(); },
  collection() { openScreen('collection'); }, shop() { openScreen('shop'); }, quests() { openScreen('quests'); }, rewards() { openScreen('rewards'); },
  drops() { openDrops(); },
  detail(d) { detailI = +d.i; previewSkinOv = undefined; openScreen('detail'); },
  select() { sel = detailI; saveSettings(); toast(BRAWLERS[sel].name+' geselecteerd'); renderScreen(); },
  prevB() { const o = ownedIdx(); sel = o[(o.indexOf(sel)-1+o.length)%o.length]; saveSettings(); refreshHub(); },
  nextB() { const o = ownedIdx(); sel = o[(o.indexOf(sel)+1)%o.length]; saveSettings(); refreshHub(); },
  upgrade() { const b = BRAWLERS[detailI], l = lvlOf(b.id), p = { coins:UP_COIN[l-1], energy:UP_EN[l-1] };
    if (l>=LEVEL_MAX) return; if (!canPay(p)) { toast('Niet genoeg munten of energie'); return; } pay(p); SAVE.lvl[b.id] = l+1; save(); Snd.play('ready'); toast(b.name+' is nu level '+(l+1)+'!'); renderScreen(); },
  unlock() { const b = BRAWLERS[detailI], p = { crystals:60 }; if (!canPay(p)) { toast('Niet genoeg kristallen'); return; } pay(p); SAVE.owned[b.id] = 1; SAVE.lvl[b.id] = 1; save(); Snd.play('ready'); toast(b.name+' ontgrendeld!'); renderScreen(); },
  equip(d) { const b = BRAWLERS[detailI]; SAVE.skinEq[b.id] = d.id || ''; save(); previewSkinOv = undefined; renderScreen(); },
  previewSkin(d) { previewSkinOv = d.id; renderScreen(); },
  buySkin(d) { const s = skinById(d.id); if (!canPay(s.price)) { toast('Niet genoeg '+(s.price.coins?'munten':'kristallen')); return; } pay(s.price); SAVE.skins[s.id] = 1; SAVE.skinEq[s.b] = s.id; save(); Snd.play('ready'); previewSkinOv = undefined; showReveal([{ t:'skin', id:s.id }], 'Gekocht!'); },
  buyDrop(d) { const price = { wood:{coins:150}, silver:{coins:400}, gold:{crystals:90} }[d.t]; if (!canPay(price)) { toast('Niet genoeg betaalmiddelen'); return; } pay(price); SAVE.drops.push(d.t); save(); startDrop(); },
  freeDrop() { if (!freeAvailable()) return; SAVE.free = today(); SAVE.drops.unshift('silver'); save(); startDrop(); },
  tabShop(d) { scrTab.shop = d.k; renderScreen(); }, tabRew(d) { scrTab.rewards = d.k; renderScreen(); },
  claimQuest(d) { const q = SAVE.quests.list.find(x=>x.id===d.id); if (!q || q.claimed || q.p<q.n) { toast('Nog niet klaar'); return; } q.claimed = true; SAVE.coins += q.coins; SAVE.xp += q.xp; save(); refreshCurrencies(); Snd.play('gem'); toast(`+${q.coins} munten, +${q.xp} XP`); renderScreen(); },
  claimRoad(d) { const i = +d.i, r = ROAD[i][1]; if (SAVE.roadClaimed[i] || trTotal()<ROAD[i][0]) return; SAVE.roadClaimed[i] = 1; save(); showReveal([r], 'Trofeeënpad!'); },
  claimPass(d) { const t = +d.i; if (SAVE.passClaimed[t] || t>passTier()) return; SAVE.passClaimed[t] = 1; save(); showReveal([passReward(t)], 'Seizoenspas tier '+t+'!'); },
  modePopup() { openModePopup(); }, closePopup() { $('popup').classList.add('hidden'); refreshHub(); },
  setMode(d) { mode = d.k; applyModeVisuals(); saveSettings(); openModePopup(); }, setDiff(d) { diff = d.k; saveSettings(); openModePopup(); },
  dropOpen() { const ch = document.querySelector('#dropScr .chest'); if (!ch || ch.classList.contains('shake')) return; ch.classList.remove('idle'); ch.classList.add('shake'); Snd.play('super');
    setTimeout(()=>{ dropState.stage = 1; dropState.given = dropState.rewards.map(grant); Snd.play('ready'); renderDrop(); }, 750); },
  dropNext() { if (dropState && !dropState.reveal && SAVE.drops.length) { startDrop(); return; }
    $('dropScr').classList.add('hidden'); dropState = null; refreshAll(); updateEndDropBtn(); },
};
function openModePopup() {
  const mc = (k,name,desc,icon)=>`<div class="modecard ${mode===k?'sel':''}" data-act="setMode" data-k="${k}"><span class="mi">${ic(icon)}</span><b>${name}</b><small>${desc}</small></div>`;
  const pill = (k,l)=>`<div class="pill ${diff===k?'sel':''}" data-act="setDiff" data-k="${k}">${l}</div>`;
  $('popupBox').innerHTML = `<h3>SPELMODUS</h3>${mc('gem','GEM GRAB','Pak 10 gems en houd ze 12 seconden vast','gem')}${mc('ball','BRAWL BALL','Scoor 2 goals voor de tegenstander','ball')}<h3>BOTS</h3><div class="pills">${pill('easy','Easy')}${pill('normal','Normaal')}${pill('hard','Pro')}</div><div class="row"><button class="btn small" data-act="closePopup">KLAAR</button></div>`;
  $('popup').classList.remove('hidden');
}
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el) return;
  Snd.init(); const fn = ACT[el.dataset.act]; if (fn) { Snd.play('click'); fn(el.dataset, el); }
});
function onEscape() {
  if (state==='menu') { if (!$('dropScr').classList.contains('hidden')) return; if (!$('popup').classList.contains('hidden')) ACT.closePopup(); else if (scrName) closeScreen(); }
  else togglePause();
}

// ---- top buttons, settings, pause ----
const muteBtn = $('muteBtn'), gearBtn = $('gearBtn'), pauseBtn = $('pauseBtn'), settingsEl = $('settings');
function toggleMute() { Snd.setMuted(!Snd.muted); muteBtn.innerHTML = ic(Snd.muted ? 'off' : 'on'); }
muteBtn.innerHTML = ic(Snd.muted ? 'off' : 'on'); muteBtn.onclick = ()=>{ Snd.init(); toggleMute(); };
gearBtn.innerHTML = ic('gear'); pauseBtn.innerHTML = ic('pause');
gearBtn.onclick = ()=>{ Snd.init(); Snd.play('click'); settingsEl.classList.toggle('open'); };
function makePills(id, opts, get, set) {
  const el = $(id); el.innerHTML = '';
  for (const [v,label] of opts) { const p = document.createElement('div'); p.className = 'pill'+(get()===v?' sel':''); p.textContent = label;
    p.onclick = ()=>{ set(v); Snd.init(); Snd.play('click'); saveSettings(); [...el.children].forEach((c,i)=>c.classList.toggle('sel',opts[i][0]===get())); }; el.appendChild(p); }
}
makePills('qualityPills', [['high','Hoog'],['low','Laag']], ()=>quality, v=>{ quality = v; applyQuality(); });
if (quality==='low') applyQuality();
let resetArmed = 0; const resetEl = $('resetAll');
resetEl.onclick = ()=>{ if (!resetArmed) { resetArmed = 1; resetEl.textContent = 'Zeker weten?'; setTimeout(()=>{ resetArmed = 0; resetEl.textContent = 'Alles resetten'; }, 3000); }
  else { SAVE = defaultSave(); save(); sel = 0; saveSettings(); resetArmed = 0; resetEl.textContent = 'Gereset'; if (state==='menu') showHubUI(); } };
addEventListener('pointerdown', e=>{ if (settingsEl.classList.contains('open') && !e.target.closest?.('#settings') && !e.target.closest?.('#gearBtn')) settingsEl.classList.remove('open'); }, true);
function setPaused(p) {
  if (p && !(state==='play' || state==='intro' || state==='goal')) return;
  paused = p; $('pause').classList.toggle('hidden', !p);
  if (p) { touch.move = touch.atk = touch.sup = null; mouse.down = false; }
}
function togglePause() { setPaused(!paused); }
pauseBtn.onclick = ()=>{ Snd.init(); Snd.play('click'); setPaused(true); };
$('resume').onclick = ()=>{ Snd.play('click'); setPaused(false); };
$('quit').onclick = ()=>{ Snd.play('click'); setPaused(false); showMenu(); };
document.addEventListener('visibilitychange', ()=>{ if (document.hidden) setPaused(true); });
$('play').onclick = ()=>{ Snd.init(); Snd.play('click'); saveSettings(); settingsEl.classList.remove('open'); startMatch(); };
$('again').onclick = ()=>{ Snd.play('click'); startMatch(); };
$('toMenu').onclick = ()=>{ Snd.play('click'); showMenu(); };
$('rotMenu').onclick = ()=>{ Snd.play('click'); showMenu(); };
['arrL','arrR'].forEach((id,i)=>{ $(id).innerHTML = ic(i?'right':'left'); });
ensureQuests(); refreshCurrencies(); refreshHub();

// =====================================================================
//  LOOP
// =====================================================================
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05,(now-last)/1000); last = now;
  try {
    const needRotate = state!=='menu' && innerHeight > innerWidth*1.05, hold = needRotate || paused;
    $('rotate').classList.toggle('hidden', !needRotate);
    const inGame = state==='play' || state==='intro' || state==='goal';
    pauseBtn.hidden = !inGame; gearBtn.hidden = state!=='menu'; $('topCurs').style.display = state==='menu' ? '' : 'none'; if (state!=='menu') settingsEl.classList.remove('open');
    if (state==='menu') renderMenu3D(dt, now/1000);
    else { if (state==='play') updateMouseWorld(); if (!hold) update(dt); render3D(hold?0:dt, now/1000); }
    drawHUD(units[0], now/1000); if (!hold) adaptQuality(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
if (document.fonts && document.fonts.load) document.fonts.load('20px "Lilita One"').catch(()=>{});
showMenu(); loadModels();
requestAnimationFrame(frame);
window.__game = { info(){ const r = renderer.info; return { calls:r.render.calls, tris:r.render.triangles, geo:r.memory.geometries, tex:r.memory.textures }; }, MAPS, setMapI(i){ setMap(MAPS[i]); }, get BR(){ return BRAWLERS; }, skinById, endMatch, damage, skipIntro(){ introT = 0; }, setMode(m){ mode = m; applyModeVisuals(); }, setDiff(d){ diff = d; }, get ball(){ return ball; }, get score(){ return score; }, get mode(){ return mode; }, startMatch, showMenu, setSel:i=>{ sel=i; refreshHub(); }, get save(){ return SAVE; }, openScreen, ACT, get units(){return units;}, get state(){return state;}, get paused(){return paused;}, setPaused, get touch(){return touch;}, get aim(){return aimDisp;}, get lock(){return lockTarget&&lockTarget.b.id;}, W, H };
</script>
